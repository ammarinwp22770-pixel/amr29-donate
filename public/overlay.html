<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMR29 Donation Alert</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --accent:#ff5b7f;
    --accent-light:#ff9ab0;
    --gold:#ffd36e;
    --success:#63df9b;
    --text:#ffffff;
    --text-soft:#f3f3f6;
    --text-muted:#b7b7c1;
    --panel:rgba(8,8,13,.97);
    --border:rgba(255,255,255,.20);
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:transparent;
    font-family:"Segoe UI","Noto Sans Thai",Arial,sans-serif;
}

body{
    user-select:none;
}

.stage{
    position:fixed;
    inset:0;
    pointer-events:none;
}


/* =========================================================
   VIDEO ONLY
========================================================= */

.video-wrap{
    position:absolute;

    left:50%;
    bottom:70px;

    width:
        min(
            760px,
            calc(100vw - 70px)
        );

    transform:
        translateX(-50%)
        translateY(24px)
        scale(.97);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .24s ease,
        transform .42s cubic-bezier(.16,1,.3,1),
        visibility .24s ease;
}

.video-wrap.show{
    opacity:1;
    visibility:visible;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);
}

.video-wrap.hiding{
    opacity:0;

    transform:
        translateX(-50%)
        translateY(18px)
        scale(.98);
}

.video-shell{
    position:relative;

    overflow:hidden;

    width:100%;

    aspect-ratio:
        16 / 9;

    border:
        2px solid
        rgba(255,255,255,.16);

    border-radius:22px;

    background:#000;

    box-shadow:
        0 28px 90px
        rgba(0,0,0,.78),

        0 0 45px
        rgba(120,202,255,.10);
}

.video-shell::before{
    content:"";

    position:absolute;

    z-index:5;

    left:26px;
    right:26px;
    top:0;

    height:3px;

    border-radius:
        0 0 999px 999px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #58bfff,
            #aee6ff,
            transparent
        );
}

#video-player{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    background:#000;
}

#video-player iframe{
    display:block;

    width:100% !important;
    height:100% !important;

    border:0;
}

.video-progress{
    position:absolute;

    z-index:8;

    left:0;
    right:0;
    bottom:0;

    height:5px;

    overflow:hidden;

    background:
        rgba(255,255,255,.16);
}

.video-progress-fill{
    width:100%;
    height:100%;

    transform-origin:
        left center;

    background:
        linear-gradient(
            90deg,
            #4eb8ff,
            #8ad9ff,
            #d4f4ff
        );

    box-shadow:
        0 0 12px
        rgba(120,202,255,.70);
}


/* =========================================================
   NORMAL DONATION ALERT
========================================================= */

.alert-wrap{
    position:absolute;

    left:50%;
    bottom:95px;

    width:
        min(
            780px,
            calc(100vw - 70px)
        );

    transform:
        translateX(-50%);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .22s ease;
}

.alert-wrap.show{
    opacity:1;
    visibility:visible;
}

.alert-card{
    position:relative;

    overflow:hidden;

    display:grid;

    grid-template-columns:
        96px
        minmax(0,1fr)
        auto;

    align-items:center;

    gap:22px;

    min-height:148px;

    padding:
        22px 27px;

    border:
        2px solid
        var(--border);

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            rgba(255,91,127,.055),
            rgba(255,255,255,.015)
        ),
        var(--panel);

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.72),

        0 3px 0
        rgba(255,255,255,.025)
        inset;

    transform:
        translateY(32px)
        scale(.95);

    opacity:0;

    transition:
        transform
        .5s
        cubic-bezier(.16,1,.3,1),

        opacity
        .3s
        ease;
}

.alert-wrap.show
.alert-card{
    transform:
        translateY(0)
        scale(1);

    opacity:1;
}

.alert-wrap.hiding
.alert-card{
    transform:
        translateY(22px)
        scale(.97);

    opacity:0;
}

.top-accent{
    position:absolute;

    left:26px;
    right:26px;
    top:0;

    height:3px;

    border-radius:
        0 0 999px 999px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--accent),
            var(--accent-light),
            transparent
        );
}

.alert-glow{
    position:absolute;

    width:300px;
    height:300px;

    left:-130px;
    top:-130px;

    border-radius:50%;

    background:
        rgba(255,91,127,.17);

    filter:
        blur(65px);

    pointer-events:none;
}

.avatar{
    position:relative;

    z-index:2;

    width:86px;
    height:86px;

    display:flex;

    justify-content:center;
    align-items:center;

    flex-shrink:0;

    border:
        2px solid
        rgba(255,91,127,.38);

    border-radius:23px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            rgba(255,91,127,.32),
            rgba(255,91,127,.13)
        );

    font-size:34px;
    font-weight:900;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,.8);

    box-shadow:
        0 12px 30px
        rgba(255,91,127,.17),

        0 0 0 1px
        rgba(255,255,255,.045)
        inset;
}

.content{
    position:relative;

    z-index:2;

    min-width:0;
}

.label-row{
    display:flex;

    align-items:center;

    gap:8px;

    margin-bottom:5px;
}

.donation-label{
    color:
        var(--accent-light);

    font-size:13px;
    font-weight:900;

    letter-spacing:1.5px;

    text-shadow:
        0 2px 6px
        rgba(0,0,0,.9);
}

.badge{
    display:none;

    padding:
        4px 8px;

    border-radius:999px;

    font-size:9px;
    font-weight:900;

    letter-spacing:.8px;
}

.badge.test{
    display:inline-flex;

    color:#ffd08a;

    background:
        rgba(255,191,105,.14);

    border:
        1px solid
        rgba(255,191,105,.28);
}

.badge.replay{
    display:inline-flex;

    color:#c2c2ff;

    background:
        rgba(155,155,255,.14);

    border:
        1px solid
        rgba(155,155,255,.27);
}

.donor-name{
    max-width:100%;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

    color:#fff;

    font-size:32px;
    line-height:1.15;

    font-weight:900;

    letter-spacing:-.5px;

    text-shadow:
        0 3px 8px
        rgba(0,0,0,.95),

        0 1px 2px
        #000;
}

.message{
    max-width:100%;

    margin-top:8px;

    overflow:hidden;

    display:-webkit-box;

    -webkit-box-orient:
        vertical;

    -webkit-line-clamp:2;

    line-clamp:2;

    color:#f7f7f9;

    font-size:18px;
    font-weight:650;

    line-height:1.4;

    text-shadow:
        0 3px 7px
        rgba(0,0,0,.95),

        0 1px 2px
        #000;
}

.amount-box{
    position:relative;

    z-index:2;

    min-width:170px;

    padding-left:15px;

    text-align:right;
}

.amount{
    color:#ff9eb3;

    font-size:43px;

    line-height:1;

    font-weight:900;

    letter-spacing:-1.2px;

    white-space:nowrap;

    text-shadow:
        0 4px 12px
        rgba(0,0,0,.95),

        0 0 20px
        rgba(255,91,127,.26);
}

.currency{
    margin-top:7px;

    color:#d0d0d7;

    font-size:11px;
    font-weight:900;

    letter-spacing:2px;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,.9);
}

.progress{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:5px;

    overflow:hidden;

    background:
        rgba(255,255,255,.09);
}

.progress-fill{
    width:100%;
    height:100%;

    transform-origin:
        left center;

    background:
        linear-gradient(
            90deg,
            #ff3e69,
            #ff6f90,
            #ffa1b5
        );

    box-shadow:
        0 0 12px
        rgba(255,91,127,.55);
}


/* =========================================================
   BIG / MEGA
========================================================= */

.alert-wrap.big
.alert-card{
    border-color:
        rgba(255,211,110,.42);

    background:
        linear-gradient(
            135deg,
            rgba(255,196,78,.10),
            rgba(255,255,255,.015)
        ),
        rgba(8,8,12,.98);

    box-shadow:
        0 28px 90px
        rgba(0,0,0,.72),

        0 0 45px
        rgba(255,195,80,.15);
}

.alert-wrap.big
.top-accent{
    background:
        linear-gradient(
            90deg,
            transparent,
            #ffb74d,
            #ffe293,
            transparent
        );
}

.alert-wrap.big
.alert-glow{
    background:
        rgba(255,190,70,.24);
}

.alert-wrap.big
.avatar{
    color:#fff6d8;

    border-color:
        rgba(255,211,110,.52);

    background:
        linear-gradient(
            145deg,
            rgba(255,197,75,.32),
            rgba(255,170,50,.12)
        );

    box-shadow:
        0 12px 36px
        rgba(255,190,70,.18);
}

.alert-wrap.big
.donation-label{
    color:
        var(--gold);
}

.alert-wrap.big
.amount{
    color:
        var(--gold);

    text-shadow:
        0 4px 12px
        rgba(0,0,0,.95),

        0 0 22px
        rgba(255,200,80,.28);
}

.alert-wrap.big
.progress-fill{
    background:
        linear-gradient(
            90deg,
            #ffa833,
            #ffd36e,
            #fff0bb
        );

    box-shadow:
        0 0 12px
        rgba(255,205,90,.60);
}

.alert-wrap.mega
.alert-card{
    animation:
        megaPulse
        1.25s
        ease-in-out
        infinite
        alternate;
}

@keyframes megaPulse{

    from{
        box-shadow:
            0 28px 90px
            rgba(0,0,0,.72),

            0 0 30px
            rgba(255,195,75,.13);
    }

    to{
        box-shadow:
            0 28px 90px
            rgba(0,0,0,.72),

            0 0 65px
            rgba(255,195,75,.31);
    }
}

.mega-text{
    position:absolute;

    left:50%;
    bottom:200px;

    transform:
        translateX(-50%)
        translateY(18px)
        scale(.90);

    color:#ffe190;

    text-align:center;

    font-size:30px;
    font-weight:900;

    letter-spacing:4px;

    white-space:nowrap;

    opacity:0;

    transition:
        .45s
        cubic-bezier(.16,1,.3,1);

    text-shadow:
        0 4px 15px
        rgba(0,0,0,.9),

        0 0 30px
        rgba(255,195,80,.42);
}

.alert-wrap.mega.show
.mega-text{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);
}


/* =========================================================
   PARTICLES
========================================================= */

.particles{
    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;
}

.particle{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ffd675;

    box-shadow:
        0 0 10px
        rgba(255,214,117,.7);

    opacity:0;

    animation:
        particleFly
        1.8s
        ease-out
        forwards;
}

@keyframes particleFly{

    0%{
        opacity:0;

        transform:
            translateY(25px)
            scale(.3);
    }

    15%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translateY(-190px)
            scale(1.25);
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:750px){

    .video-wrap{
        bottom:40px;

        width:
            calc(100vw - 24px);
    }

    .video-shell{
        border-radius:16px;
    }

    .alert-wrap{
        bottom:40px;

        width:
            calc(100vw - 24px);
    }

    .alert-card{
        grid-template-columns:
            70px
            minmax(0,1fr);

        gap:14px;

        min-height:125px;

        padding:17px;
    }

    .avatar{
        width:64px;
        height:64px;

        border-radius:18px;

        font-size:25px;
    }

    .donation-label{
        font-size:10px;
    }

    .donor-name{
        font-size:23px;
    }

    .message{
        font-size:14px;
    }

    .amount-box{
        grid-column:2;

        min-width:0;

        padding-left:0;

        margin-top:1px;

        text-align:left;
    }

    .amount{
        font-size:29px;
    }

    .currency{
        display:none;
    }

    .mega-text{
        bottom:175px;

        font-size:22px;
    }
}

</style>
</head>


<body>


<div class="stage">


    <div
        class="particles"
        id="particles"
    ></div>



    <!-- =====================================================
         VIDEO DONATION

         ถ้ามี Video
         จะแสดงเฉพาะส่วนนี้เท่านั้น
    ====================================================== -->

    <div
        class="video-wrap"
        id="video-wrap"
    >

        <div class="video-shell">


            <div
                id="video-player"
            ></div>


            <div class="video-progress">

                <div
                    class="video-progress-fill"
                    id="video-progress-fill"
                ></div>

            </div>

        </div>

    </div>



    <!-- =====================================================
         NORMAL DONATION

         ใช้เมื่อไม่มี Video เท่านั้น
    ====================================================== -->

    <div
        class="alert-wrap"
        id="alert-wrap"
    >


        <div
            class="mega-text"
            id="mega-text"
        >
            BIG SUPPORT ❤️
        </div>



        <div class="alert-card">


            <div class="top-accent"></div>


            <div class="alert-glow"></div>



            <div
                class="avatar"
                id="avatar"
            >
                A
            </div>



            <div class="content">


                <div class="label-row">


                    <div
                        class="donation-label"
                        id="donation-label"
                    >
                        NEW DONATION
                    </div>


                    <div
                        class="badge"
                        id="alert-badge"
                    ></div>

                </div>



                <div
                    class="donor-name"
                    id="donor-name"
                >
                    Anonymous
                </div>



                <div
                    class="message"
                    id="message"
                ></div>

            </div>



            <div class="amount-box">


                <div
                    class="amount"
                    id="amount"
                >
                    ฿0
                </div>


                <div class="currency">
                    THB
                </div>

            </div>



            <div class="progress">

                <div
                    class="progress-fill"
                    id="progress-fill"
                ></div>

            </div>

        </div>

    </div>

</div>



<audio
    id="alert-sound"
    preload="auto"
    src="/sounds/alert.mp3"
></audio>


<script src="/socket.io/socket.io.js"></script>

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =========================================================
   CONFIG
========================================================= */

const VIDEO_MAX_DURATION =
    20;


const VIDEO_MAX_START =
    12 *
    60 *
    60;


const VIDEO_SHOW_DELAY =
    180;


const VIDEO_HIDE_DELAY =
    220;


/*
YouTube ต้องเริ่มเล่นภายใน 10 วินาที
ไม่งั้นข้ามเพื่อไม่ให้ Queue ค้าง
*/

const VIDEO_LOAD_TIMEOUT =
    10000;


/*
Hard timeout ป้องกัน Player ค้าง
*/

const VIDEO_HARD_GRACE =
    8000;



/* =========================================================
   ALERT SETTINGS
========================================================= */

let alertSettings = {

    ttsEnabled:
        true,

    readMessage:
        true,

    ttsRate:
        1,

    bigAmount:
        500,

    megaAmount:
        1000,

    afterTtsDelay:
        1000,

    noTtsDisplayTime:
        4500
};



/* =========================================================
   SOCKET
========================================================= */

const socket =
    io();



/* =========================================================
   ELEMENTS
========================================================= */

const alertWrap =
    document.getElementById(
        "alert-wrap"
    );


const avatar =
    document.getElementById(
        "avatar"
    );


const donorName =
    document.getElementById(
        "donor-name"
    );


const messageElement =
    document.getElementById(
        "message"
    );


const amountElement =
    document.getElementById(
        "amount"
    );


const donationLabel =
    document.getElementById(
        "donation-label"
    );


const alertBadge =
    document.getElementById(
        "alert-badge"
    );


const progressFill =
    document.getElementById(
        "progress-fill"
    );


const particles =
    document.getElementById(
        "particles"
    );


const megaText =
    document.getElementById(
        "mega-text"
    );


const alertSound =
    document.getElementById(
        "alert-sound"
    );


const videoWrap =
    document.getElementById(
        "video-wrap"
    );


const videoProgressFill =
    document.getElementById(
        "video-progress-fill"
    );



/* =========================================================
   QUEUE
========================================================= */

const donationQueue =
    [];


let playing =
    false;


let currentDonation =
    null;



/* =========================================================
   ANIMATION STATE
========================================================= */

let progressAnimation =
    null;


let videoProgressAnimation =
    null;



/* =========================================================
   YOUTUBE PLAYER STATE
========================================================= */

let youtubePlayer =
    null;


let youtubeApiReady =
    false;


let resolveYouTubeReady =
    null;



const youtubeReadyPromise =
    new Promise(
        resolve => {

            resolveYouTubeReady =
                resolve;
        }
    );



/* =========================================================
   YOUTUBE API READY
========================================================= */

window.onYouTubeIframeAPIReady =
    function(){

        youtubeApiReady =
            true;


        if(
            resolveYouTubeReady
        ){

            resolveYouTubeReady();
        }
    };



/*
กรณี API โหลดเสร็จเร็วมาก
*/

if(
    window.YT
    &&
    window.YT.Player
){

    youtubeApiReady =
        true;


    if(
        resolveYouTubeReady
    ){

        resolveYouTubeReady();
    }
}



/* =========================================================
   LOAD ALERT SETTINGS
========================================================= */

async function loadAlertSettings(){

    try{

        const response =
            await fetch(

                "/api/alert-settings",

                {
                    cache:
                        "no-store"
                }
            );


        const data =
            await response
                .json();


        if(
            !response.ok
            ||
            !data.success
            ||
            !data.settings
        ){

            return;
        }


        alertSettings = {

            ...alertSettings,

            ...data.settings
        };


        console.log(
            "Alert Settings:",
            alertSettings
        );

    }
    catch(error){

        console.error(
            "Load Alert Settings:",
            error
        );
    }
}



/* =========================================================
   REALTIME ALERT SETTINGS
========================================================= */

socket.on(

    "alert-settings-update",

    settings => {

        if(
            !settings
        ){

            return;
        }


        alertSettings = {

            ...alertSettings,

            ...settings
        };


        console.log(
            "Alert Settings updated:",
            alertSettings
        );
    }
);



/* =========================================================
   RECEIVE DONATION
========================================================= */

socket.on(

    "donation",

    donation => {


        if(
            !donation
        ){

            return;
        }



        const amount =
            Number(
                donation.amount
            );



        if(
            !Number.isFinite(
                amount
            )
            ||
            amount <= 0
        ){

            return;
        }



        const video =
            normalizeVideoDonation(
                donation
            );



        donationQueue.push({


            name:

                String(
                    donation.name
                    ||
                    "Anonymous"
                )
                .trim()
                .slice(
                    0,
                    30
                ),



            message:

                String(
                    donation.message
                    ||
                    ""
                )
                .trim()
                .slice(
                    0,
                    200
                ),



            amount,



            isTest:

                Boolean(
                    donation.isTest
                    ||
                    donation.test
                ),



            isReplay:

                Boolean(
                    donation.isReplay
                    ||
                    donation.replay
                ),



            soundUrl:

                sanitizeSoundUrl(
                    donation.soundUrl
                ),



            customSound:

                Boolean(
                    donation.customSound
                ),



            soundTier:

                String(
                    donation.soundTier
                    ||
                    ""
                ),



            ...video
        });



        playNextDonation();
    }
);



/* =========================================================
   QUEUE PLAYER
========================================================= */

async function playNextDonation(){


    if(
        playing
        ||
        donationQueue.length ===
        0
    ){

        return;
    }



    playing =
        true;



    currentDonation =
        donationQueue.shift();



    try{


        /*
        =====================================================
        VIDEO DONATION
        =====================================================

        มี Video:
        - ไม่แสดง Alert ปกติ
        - ไม่เล่น Donation Sound
        - ไม่เล่น Custom Sound
        - ไม่อ่าน TTS
        - ไม่แสดงชื่อ/ยอด/ข้อความ
        - เปิด YouTube อย่างเดียว
        */


        if(
            currentDonation.videoId
        ){

            await playVideoDonation(
                currentDonation
            );
        }


        /*
        =====================================================
        NORMAL DONATION
        =====================================================
        */

        else{

            await showNormalDonation(
                currentDonation
            );
        }

    }
    catch(error){

        console.error(
            "Donation Overlay Error:",
            error
        );

    }
    finally{


        cleanupEverything();



        await delay(
            450
        );



        playing =
            false;



        currentDonation =
            null;



        playNextDonation();
    }
}

/* =========================================================
   WAIT YOUTUBE API
========================================================= */

async function waitForYouTubeAPI(){


    if(
        youtubeApiReady

        &&

        window.YT

        &&

        window.YT.Player
    ){

        return;
    }



    await Promise.race([


        youtubeReadyPromise,


        delay(
            VIDEO_LOAD_TIMEOUT
        )
        .then(
            () => {

                throw new Error(
                    "YouTube IFrame API timeout"
                );
            }
        )
    ]);



    if(
        !window.YT

        ||

        !window.YT.Player
    ){

        throw new Error(
            "YouTube IFrame API unavailable"
        );
    }
}



/* =========================================================
   PLAY YOUTUBE CLIP
========================================================= */

async function playYouTubeClip(
    videoId,
    start,
    duration
){


    try{

        await waitForYouTubeAPI();

    }
    catch(error){

        console.error(
            "YouTube API:",
            error
        );


        return "error";
    }



    const safeStart =

        clamp(

            Math.floor(

                Number(
                    start
                )

                ||

                0
            ),

            0,

            VIDEO_MAX_START
        );



    const safeDuration =

        clamp(

            Math.floor(

                Number(
                    duration
                )

                ||

                VIDEO_MAX_DURATION
            ),

            1,

            VIDEO_MAX_DURATION
        );



    return new Promise(
        resolve => {


            let finished =
                false;


            let playbackStarted =
                false;


            let loadTimeout =
                null;


            let durationTimeout =
                null;


            let hardTimeout =
                null;



            /*
            =====================================================
            FINISH
            =====================================================
            */


            const finish =
                async status => {


                    if(
                        finished
                    ){

                        return;
                    }


                    finished =
                        true;



                    clearTimeout(
                        loadTimeout
                    );


                    clearTimeout(
                        durationTimeout
                    );


                    clearTimeout(
                        hardTimeout
                    );



                    if(
                        videoProgressAnimation
                    ){

                        videoProgressAnimation
                            .cancel();


                        videoProgressAnimation =
                            null;
                    }



                    await destroyYouTubePlayer();



                    resolve(
                        status
                    );
                };



            /*
            =====================================================
            START DURATION TIMER
            =====================================================

            เริ่มนับเวลาจริง
            หลัง YouTube เริ่ม PLAYING แล้วเท่านั้น
            */


            const startDurationTimer =
                () => {


                    if(
                        playbackStarted
                    ){

                        return;
                    }


                    playbackStarted =
                        true;



                    clearTimeout(
                        loadTimeout
                    );



                    /*
                    Progress
                    */


                    videoProgressAnimation =

                        videoProgressFill
                            .animate(

                                [
                                    {
                                        transform:
                                            "scaleX(1)"
                                    },

                                    {
                                        transform:
                                            "scaleX(0)"
                                    }
                                ],

                                {

                                    duration:

                                        safeDuration

                                        *

                                        1000,


                                    easing:
                                        "linear",


                                    fill:
                                        "forwards"
                                }
                            );



                    /*
                    Stop ตามเวลาที่คนโดเนทเลือก
                    */


                    durationTimeout =

                        setTimeout(

                            () => {

                                finish(
                                    "complete"
                                );
                            },

                            safeDuration

                            *

                            1000
                        );
                };



            /*
            =====================================================
            LOAD TIMEOUT
            =====================================================
            */


            loadTimeout =

                setTimeout(

                    () => {

                        finish(
                            "error"
                        );
                    },

                    VIDEO_LOAD_TIMEOUT
                );



            /*
            =====================================================
            HARD TIMEOUT
            =====================================================
            */


            hardTimeout =

                setTimeout(

                    () => {

                        finish(
                            "error"
                        );
                    },

                    (
                        safeDuration

                        *

                        1000
                    )

                    +

                    VIDEO_HARD_GRACE
                );



            /*
            =====================================================
            CREATE PLAYER
            =====================================================
            */


            try{


                ensureVideoPlayerHost();



                youtubePlayer =

                    new YT.Player(

                        "video-player",

                        {


                            width:
                                "100%",


                            height:
                                "100%",


                            videoId,



                            playerVars: {


                                autoplay:
                                    1,


                                controls:
                                    0,


                                disablekb:
                                    1,


                                fs:
                                    0,


                                iv_load_policy:
                                    3,


                                modestbranding:
                                    1,


                                playsinline:
                                    1,


                                rel:
                                    0,


                                start:
                                    safeStart
                            },



                            events: {


                                /* =============================
                                   READY
                                ============================= */


                                onReady:
                                    event => {


                                        try{


                                            /*
                                            บังคับไปจุดที่เลือก
                                            */


                                            event.target.seekTo(

                                                safeStart,

                                                true
                                            );



                                            /*
                                            เสียงคลิปต้องเปิด
                                            */


                                            event.target.unMute();



                                            event.target.setVolume(
                                                100
                                            );



                                            /*
                                            Play
                                            */


                                            event.target.playVideo();

                                        }
                                        catch(error){

                                            console.warn(
                                                "YouTube onReady:",
                                                error
                                            );
                                        }
                                    },



                                /* =============================
                                   STATE
                                ============================= */


                                onStateChange:
                                    event => {


                                        /*
                                        เริ่มเล่นจริงแล้ว
                                        */


                                        if(
                                            event.data

                                            ===

                                            YT.PlayerState.PLAYING
                                        ){

                                            startDurationTimer();
                                        }



                                        /*
                                        คลิปจบก่อนเวลาที่เลือก
                                        */


                                        if(
                                            event.data

                                            ===

                                            YT.PlayerState.ENDED
                                        ){

                                            finish(
                                                "ended"
                                            );
                                        }
                                    },



                                /* =============================
                                   ERROR
                                ============================= */


                                onError:
                                    event => {


                                        console.warn(
                                            "YouTube Player Error:",
                                            event.data
                                        );


                                        finish(
                                            "error"
                                        );
                                    }
                            }
                        }
                    );

            }
            catch(error){

                console.error(
                    "Create YouTube Player:",
                    error
                );


                finish(
                    "error"
                );
            }
        }
    );
}



/* =========================================================
   ENSURE PLAYER HOST
========================================================= */

function ensureVideoPlayerHost(){


    let host =
        document.getElementById(
            "video-player"
        );



    /*
    Div อยู่แล้ว
    */


    if(
        host

        &&

        host.tagName
            .toLowerCase()

        ===

        "div"
    ){

        return host;
    }



    /*
    มี iframe เก่าค้าง
    */


    if(
        host
    ){

        host.remove();
    }



    /*
    สร้าง Div ใหม่
    */


    host =
        document.createElement(
            "div"
        );


    host.id =
        "video-player";



    const shell =

        videoWrap.querySelector(
            ".video-shell"
        );



    const progress =

        shell.querySelector(
            ".video-progress"
        );



    shell.insertBefore(

        host,

        progress
    );



    return host;
}



/* =========================================================
   DESTROY YOUTUBE PLAYER
========================================================= */

async function destroyYouTubePlayer(){


    if(
        youtubePlayer
    ){


        try{

            youtubePlayer.stopVideo();

        }catch{}



        try{

            youtubePlayer.destroy();

        }catch{}



        youtubePlayer =
            null;
    }



    /*
    YT.Player destroy()
    อาจลบ Element ออกไป
    เลยสร้าง Host กลับไว้สำหรับ Donation ถัดไป
    */


    ensureVideoPlayerHost();
}

/* =========================================================
   NORMALIZE VIDEO DONATION
========================================================= */

function normalizeVideoDonation(
    donation
){


    const rawVideoId =

        String(

            donation.videoId

            ||

            donation.video_id

            ||

            ""
        )
        .trim();



    let videoId =

        /^[A-Za-z0-9_-]{11}$/
            .test(
                rawVideoId
            )

            ?

            rawVideoId

            :

            null;



    /*
    ถ้า Server ส่งแค่ URL
    */


    if(
        !videoId

        &&

        (
            donation.videoUrl

            ||

            donation.video_url
        )
    ){

        videoId =

            extractYouTubeId(

                donation.videoUrl

                ||

                donation.video_url
            );
    }



    /*
    ไม่มี Video
    */


    if(
        !videoId
    ){

        return {

            videoUrl:
                null,

            videoId:
                null,

            videoStart:
                null,

            videoDuration:
                null
        };
    }



    /*
    Start
    */


    const videoStart =

        clamp(

            Math.floor(

                Number(

                    donation.videoStart

                    ??

                    donation.video_start

                    ??

                    0
                )

                ||

                0
            ),

            0,

            VIDEO_MAX_START
        );



    /*
    Duration
    */


    const videoDuration =

        clamp(

            Math.floor(

                Number(

                    donation.videoDuration

                    ??

                    donation.video_duration

                    ??

                    VIDEO_MAX_DURATION
                )

                ||

                VIDEO_MAX_DURATION
            ),

            1,

            VIDEO_MAX_DURATION
        );



    return {


        videoUrl:

            `https://www.youtube.com/watch?v=${videoId}`,


        videoId,


        videoStart,


        videoDuration
    };
}



/* =========================================================
   EXTRACT YOUTUBE ID
========================================================= */

function extractYouTubeId(
    value
){


    let raw =

        String(
            value
            ||
            ""
        )
        .trim();



    if(
        !raw
    ){

        return null;
    }



    /*
    URL ไม่มี https://
    */


    if(
        !/^https?:\/\//i
            .test(
                raw
            )
    ){

        raw =

            "https://"

            +

            raw;
    }



    let url;



    try{

        url =
            new URL(
                raw
            );

    }
    catch{

        return null;
    }



    const host =

        url.hostname
            .toLowerCase()
            .replace(
                /^www\./,
                ""
            );



    let id =
        null;



    /* =====================================================
       youtu.be
    ====================================================== */

    if(
        host ===
        "youtu.be"
    ){

        id =

            url.pathname
                .split("/")
                .filter(
                    Boolean
                )[0]

            ||

            null;
    }



    /* =====================================================
       youtube.com
    ====================================================== */

    if(
        host ===
            "youtube.com"

        ||

        host ===
            "m.youtube.com"

        ||

        host ===
            "music.youtube.com"
    ){


        /*
        watch?v=
        */


        if(
            url.pathname ===
            "/watch"
        ){

            id =

                url.searchParams
                    .get(
                        "v"
                    );
        }



        /*
        shorts / live / embed
        */


        else if(

            /^\/(shorts|live|embed)\//
                .test(
                    url.pathname
                )
        ){

            id =

                url.pathname
                    .split("/")
                    .filter(
                        Boolean
                    )[1]

                ||

                null;
        }
    }



    if(
        id

        &&

        /^[A-Za-z0-9_-]{11}$/
            .test(
                id
            )
    ){

        return id;
    }



    return null;
}

){

                )

        if(

========================================================= */

function sanitizeSoundUrl(
    value
){


    const raw =

        String(
            value
            ||
            ""
        )
        .trim();



    if(
        !raw
    ){

        return "/sounds/alert.mp3";
    }



    /*
    Default Tier Sound
    */


    if(
        raw.startsWith(

        )

    */

    */

}



/* =========================================================
   WAIT AUDIO
========================================================= */

function waitForAudioEnd(
    audio
){


    return new Promise(
        resolve => {


            if(
                audio.paused

                ||

                audio.ended
            ){

                resolve();

                return;
            }



            let done =
                false;



            let timeoutId =
                null;



            const finish =
                () => {


                    if(
                        done
                    ){

                        return;
                    }


                    done =
                        true;



                    audio.removeEventListener(

                        "ended",

                        finish
                    );



                    audio.removeEventListener(

                        "error",

                        finish
                    );



                    clearTimeout(
                        timeoutId
                    );



                    resolve();
                };



            audio.addEventListener(

                "ended",

                finish,

                {
                    once:
                        true
                }
            );



            audio.addEventListener(

                "error",

                finish,

                {
                    once:
                        true
                }
            );



            /*
            Custom Sound จำกัดไม่เกิน 10 วิ
            แต่เผื่อเวลาโหลด
            */


            timeoutId =

                setTimeout(

                    finish,

                    12000
                );
        }
    );
}



/* =========================================================
   CREATE TTS TEXT

   ใช้เฉพาะ Donation ปกติ
========================================================= */

function createSpeechText(
    donation
){


    const name =

        donation.name

        ||

        "Anonymous";



    let text =

        `${name} สนับสนุน ${formatAmountForSpeech(
            donation.amount
        )} บาท`;



    if(
        Boolean(
            alertSettings.readMessage
        )

        &&

        donation.message
    ){

        text +=

            ` ข้อความว่า ${donation.message}`;
    }



    return text;
}



/* =========================================================
   SPEAK
========================================================= */

function speak(
    text
){


    return new Promise(
        resolve => {


            if(
                !window.speechSynthesis

                ||

                !text
            ){

                resolve();

                return;
            }



            cancelTTS();



            const utterance =

                new SpeechSynthesisUtterance(
                    text
                );



            utterance.lang =
                "th-TH";



            utterance.rate =

                clamp(

                    Number(
                        alertSettings.ttsRate
                    )

                    ||

                    1,

                    .5,

                    2
                );



            utterance.pitch =
                1;



            utterance.volume =
                1;



            let finished =
                false;



            let timeoutId =
                null;



            const finish =
                () => {


                    if(
                        finished
                    ){

                        return;
                    }


                    finished =
                        true;



                    clearTimeout(
                        timeoutId
                    );



                    resolve();
                };



            utterance.onend =
                finish;



            utterance.onerror =
                finish;



            window
                .speechSynthesis
                .speak(
                    utterance
                );



            timeoutId =

                setTimeout(

                    finish,

                    Math.max(

                        5000,

                        estimateSpeechDuration(
                            text
                        )

                        +

                        4000
                    )
                );
        }
    );
}



/* =========================================================
   CANCEL TTS
========================================================= */

function cancelTTS(){


    if(
        window.speechSynthesis
    ){

        try{

            window
                .speechSynthesis
                .cancel();

        }catch{}
    }
}



/* =========================================================
   ESTIMATE TTS
========================================================= */

function estimateSpeechDuration(
    text
){


    const characters =

        String(
            text
            ||
            ""
        )
        .length;



    const rate =

        clamp(

            Number(
                alertSettings.ttsRate
            )

            ||

            1,

            .5,

            2
        );



    return Math.max(

        2800,

        Math.min(

            20000,

            (
                characters

                /

                11

                *

                1000
            )

            /

            rate
        )
    );
}



/* =========================================================
   ALERT PROGRESS
========================================================= */

function startProgress(
    duration
){


    if(
        progressAnimation
    ){

        progressAnimation
            .cancel();


        progressAnimation =
            null;
    }



    progressFill
        .style
        .transform =
        "scaleX(1)";



    progressAnimation =

        progressFill
            .animate(

                [

                    {
                        transform:
                            "scaleX(1)"
                    },


                    {
                        transform:
                            "scaleX(0)"
                    }
                ],

                {

                    duration:

                        Math.max(
                            500,
                            duration
                        ),


                    easing:
                        "linear",


                    fill:
                        "forwards"
                }
            );
}



/* =========================================================
   HIDE NORMAL ALERT
========================================================= */

function hideAlert(){


    if(
        progressAnimation
    ){

        progressAnimation
            .cancel();


        progressAnimation =
            null;
    }



    alertWrap
        .classList
        .add(
            "hiding"
        );



    alertWrap
        .classList
        .remove(
            "show"
        );



    stopAlertAudio();



    cancelTTS();
}



/* =========================================================
   RESET NORMAL ALERT
========================================================= */

function resetAlertClasses(){


    hideAlert();



    alertWrap
        .classList
        .remove(

            "big",

            "mega",

            "show",

            "hiding"
        );



    particles.innerHTML =
        "";



    progressFill
        .style
        .transform =
        "scaleX(1)";
}



/* =========================================================
   CLEANUP EVERYTHING
========================================================= */

function cleanupEverything(){


    hideAlert();



    hideVideo();



    stopAlertAudio();



    cancelTTS();



    particles.innerHTML =
        "";
}



/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    amount
){


    particles.innerHTML =
        "";



    for(
        let index =
            0;

        index <
        amount;

        index++
    ){


        const particle =

            document
                .createElement(
                    "div"
                );



        particle.className =
            "particle";



        particle.style.left =

            (
                22

                +

                Math.random()

                *

                56
            )

            +

            "%";



        particle.style.bottom =

            (
                80

                +

                Math.random()

                *

                95
            )

            +

            "px";



        particle.style.animationDelay =

            (
                Math.random()

                *

                .7
            )

            +

            "s";



        particle.style.animationDuration =

            (
                1.3

                +

                Math.random()

                *

                1.2
            )

            +

            "s";



        const size =

            4

            +

            Math.random()

            *

            7;



        particle.style.width =

            size

            +

            "px";



        particle.style.height =

            size

            +

            "px";



        particles
            .appendChild(
                particle
            );
    }
}



/* =========================================================
   FIRST CHARACTER
========================================================= */

function getFirstCharacter(
    value
){


    const text =

        String(
            value
            ||
            "A"
        )
        .trim();



    if(
        !text
    ){

        return "A";
    }



    return Array
        .from(
            text
        )[0]
        .toUpperCase();
}



/* =========================================================
   FORMAT AMOUNT FOR SPEECH
========================================================= */

function formatAmountForSpeech(
    amount
){


    return Number(
        amount
        ||
        0
    )
    .toLocaleString(
        "th-TH"
    );
}



/* =========================================================
   CLAMP
========================================================= */

function clamp(
    value,
    min,
    max
){


    return Math.min(

        max,

        Math.max(
            min,
            value
        )
    );
}



/* =========================================================
   DELAY
========================================================= */

function delay(
    milliseconds
){


    return new Promise(

        resolve =>

            setTimeout(
                resolve,
                milliseconds
            )
    );
}



/* =========================================================
   START
========================================================= */

loadAlertSettings();
