<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AMR29 Donation Alert</title>


<style>

* {
    box-sizing: border-box;
}


:root {

    --accent:
        #ff5b7f;

    --accent-light:
        #ff9ab0;

    --gold:
        #ffd36e;

    --gold-light:
        #ffe7a4;

    --text:
        #ffffff;

    --text-soft:
        #f3f3f6;

    --muted:
        #b7b7c1;

    --panel:
        rgba(8,8,13,.97);

    --border:
        rgba(255,255,255,.20);
}


html,
body {

    width:
        100%;

    height:
        100%;

    margin:
        0;

    overflow:
        hidden;

    background:
        transparent;

    font-family:
        "Segoe UI",
        "Noto Sans Thai",
        Arial,
        sans-serif;
}


body {
    user-select: none;
}


/* =========================================================
   STAGE
========================================================= */

.stage {

    position:
        fixed;

    inset:
        0;

    pointer-events:
        none;
}


/* =========================================================
   ALERT
========================================================= */

.alert-wrap {

    position:
        absolute;

    left:
        50%;

    bottom:
        95px;

    width:
        min(
            780px,
            calc(100vw - 70px)
        );

    transform:
        translateX(-50%);

    opacity:
        0;

    visibility:
        hidden;

    transition:
        opacity .22s ease;
}


.alert-wrap.show {

    opacity:
        1;

    visibility:
        visible;
}


/* =========================================================
   CARD
========================================================= */

.alert-card {

    position:
        relative;

    overflow:
        hidden;

    display:
        grid;

    grid-template-columns:
        96px
        minmax(0,1fr)
        auto;

    align-items:
        center;

    gap:
        22px;

    min-height:
        148px;

    padding:
        22px 27px;

    border:
        2px solid
        var(--border);

    border-radius:
        25px;

    background:

        linear-gradient(
            135deg,
            rgba(255,91,127,.055),
            rgba(255,255,255,.015)
        ),

        var(--panel);

    box-shadow:

        0 25px 80px
        rgba(0,0,0,.72),

        0 3px 0
        rgba(255,255,255,.025)
        inset;

    transform:
        translateY(32px)
        scale(.95);

    opacity:
        0;

    transition:

        transform .5s
        cubic-bezier(.16,1,.3,1),

        opacity .3s ease;
}


.alert-wrap.show
.alert-card {

    transform:
        translateY(0)
        scale(1);

    opacity:
        1;
}


.alert-wrap.hiding
.alert-card {

    transform:
        translateY(22px)
        scale(.97);

    opacity:
        0;
}


/* =========================================================
   TOP LINE
========================================================= */

.top-accent {

    position:
        absolute;

    left:
        26px;

    right:
        26px;

    top:
        0;

    height:
        3px;

    border-radius:
        0 0 999px 999px;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--accent),
            var(--accent-light),
            transparent
        );
}


/* =========================================================
   GLOW
========================================================= */

.alert-glow {

    position:
        absolute;

    width:
        300px;

    height:
        300px;

    left:
        -130px;

    top:
        -130px;

    border-radius:
        50%;

    background:
        rgba(255,91,127,.17);

    filter:
        blur(65px);

    pointer-events:
        none;
}


/* =========================================================
   AVATAR
========================================================= */

.avatar {

    position:
        relative;

    z-index:
        2;

    width:
        86px;

    height:
        86px;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    flex-shrink:
        0;

    border:
        2px solid
        rgba(255,91,127,.38);

    border-radius:
        23px;

    color:
        #ffffff;

    background:

        linear-gradient(
            145deg,
            rgba(255,91,127,.32),
            rgba(255,91,127,.13)
        );

    font-size:
        34px;

    font-weight:
        900;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,.8);

    box-shadow:

        0 12px 30px
        rgba(255,91,127,.17),

        0 0 0 1px
        rgba(255,255,255,.045)
        inset;
}


/* =========================================================
   CONTENT
========================================================= */

.content {

    position:
        relative;

    z-index:
        2;

    min-width:
        0;
}


.label-row {

    display:
        flex;

    align-items:
        center;

    flex-wrap:
        wrap;

    gap:
        7px;

    margin-bottom:
        5px;
}


.donation-label {

    color:
        var(--accent-light);

    font-size:
        13px;

    font-weight:
        900;

    letter-spacing:
        1.5px;

    text-shadow:
        0 2px 6px
        rgba(0,0,0,.9);
}


/* =========================================================
   BADGES
========================================================= */

.badge {

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        4px 8px;

    border-radius:
        999px;

    font-size:
        9px;

    font-weight:
        900;

    letter-spacing:
        .8px;
}


.badge.test {

    display:
        inline-flex;

    color:
        #ffd08a;

    background:
        rgba(255,191,105,.14);

    border:
        1px solid
        rgba(255,191,105,.28);
}


.badge.replay {

    display:
        inline-flex;

    color:
        #c2c2ff;

    background:
        rgba(155,155,255,.14);

    border:
        1px solid
        rgba(155,155,255,.27);
}


.badge.custom {

    display:
        inline-flex;

    color:
        #a8e8ff;

    background:
        rgba(86,200,255,.12);

    border:
        1px solid
        rgba(86,200,255,.27);
}


/* =========================================================
   NAME
========================================================= */

.donor-name {

    max-width:
        100%;

    overflow:
        hidden;

    white-space:
        nowrap;

    text-overflow:
        ellipsis;

    color:
        #ffffff;

    font-size:
        32px;

    line-height:
        1.15;

    font-weight:
        900;

    letter-spacing:
        -.5px;

    text-shadow:

        0 3px 8px
        rgba(0,0,0,.95),

        0 1px 2px
        rgba(0,0,0,1);
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    max-width:
        100%;

    margin-top:
        8px;

    overflow:
        hidden;

    display:
        -webkit-box;

    -webkit-box-orient:
        vertical;

    -webkit-line-clamp:
        2;

    line-clamp:
        2;

    color:
        #f7f7f9;

    font-size:
        18px;

    font-weight:
        650;

    line-height:
        1.4;

    text-shadow:

        0 3px 7px
        rgba(0,0,0,.95),

        0 1px 2px
        rgba(0,0,0,1);
}


/* =========================================================
   AMOUNT
========================================================= */

.amount-box {

    position:
        relative;

    z-index:
        2;

    min-width:
        170px;

    padding-left:
        15px;

    text-align:
        right;
}


.amount {

    color:
        #ff9eb3;

    font-size:
        43px;

    line-height:
        1;

    font-weight:
        900;

    letter-spacing:
        -1.2px;

    white-space:
        nowrap;

    text-shadow:

        0 4px 12px
        rgba(0,0,0,.95),

        0 0 20px
        rgba(255,91,127,.26);
}


.currency {

    margin-top:
        7px;

    color:
        #d0d0d7;

    font-size:
        11px;

    font-weight:
        900;

    letter-spacing:
        2px;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress {

    position:
        absolute;

    left:
        0;

    right:
        0;

    bottom:
        0;

    height:
        5px;

    overflow:
        hidden;

    background:
        rgba(255,255,255,.09);
}


.progress-fill {

    width:
        100%;

    height:
        100%;

    transform-origin:
        left center;

    background:

        linear-gradient(
            90deg,
            #ff3e69,
            #ff6f90,
            #ffa1b5
        );

    box-shadow:
        0 0 12px
        rgba(255,91,127,.55);
}


/* =========================================================
   BIG
========================================================= */

.alert-wrap.big
.alert-card {

    border-color:
        rgba(255,211,110,.42);

    background:

        linear-gradient(
            135deg,
            rgba(255,196,78,.10),
            rgba(255,255,255,.015)
        ),

        rgba(8,8,12,.98);

    box-shadow:

        0 28px 90px
        rgba(0,0,0,.72),

        0 0 45px
        rgba(255,195,80,.15);
}


.alert-wrap.big
.top-accent {

    background:

        linear-gradient(
            90deg,
            transparent,
            #ffb74d,
            #ffe293,
            transparent
        );
}


.alert-wrap.big
.alert-glow {

    background:
        rgba(255,190,70,.24);
}


.alert-wrap.big
.avatar {

    color:
        #fff6d8;

    border-color:
        rgba(255,211,110,.52);

    background:

        linear-gradient(
            145deg,
            rgba(255,197,75,.32),
            rgba(255,170,50,.12)
        );
}


.alert-wrap.big
.donation-label {

    color:
        var(--gold);
}


.alert-wrap.big
.amount {

    color:
        var(--gold);
}


.alert-wrap.big
.progress-fill {

    background:

        linear-gradient(
            90deg,
            #ffa833,
            #ffd36e,
            #fff0bb
        );
}


/* =========================================================
   CUSTOM SOUND VISUAL
========================================================= */

.alert-wrap.custom-sound
.avatar {

    box-shadow:

        0 12px 30px
        rgba(86,200,255,.15),

        0 0 0 1px
        rgba(255,255,255,.045)
        inset;
}


/* =========================================================
   MEGA
========================================================= */

.alert-wrap.mega
.alert-card {

    animation:
        megaPulse
        1.25s
        ease-in-out
        infinite alternate;
}


@keyframes megaPulse {

    from {

        box-shadow:

            0 28px 90px
            rgba(0,0,0,.72),

            0 0 30px
            rgba(255,195,75,.13);
    }

    to {

        box-shadow:

            0 28px 90px
            rgba(0,0,0,.72),

            0 0 65px
            rgba(255,195,75,.31);
    }
}


/* =========================================================
   MEGA TEXT
========================================================= */

.mega-text {

    position:
        absolute;

    left:
        50%;

    bottom:
        200px;

    transform:
        translateX(-50%)
        translateY(18px)
        scale(.90);

    color:
        #ffe190;

    text-align:
        center;

    font-size:
        30px;

    font-weight:
        900;

    letter-spacing:
        4px;

    white-space:
        nowrap;

    opacity:
        0;

    transition:
        .45s
        cubic-bezier(.16,1,.3,1);

    text-shadow:

        0 4px 15px
        rgba(0,0,0,.9),

        0 0 30px
        rgba(255,195,80,.42);
}


.alert-wrap.mega.show
.mega-text {

    opacity:
        1;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);
}


/* =========================================================
   PARTICLES
========================================================= */

.particles {

    position:
        fixed;

    inset:
        0;

    overflow:
        hidden;

    pointer-events:
        none;
}


.particle {

    position:
        absolute;

    width:
        7px;

    height:
        7px;

    border-radius:
        50%;

    background:
        #ffd675;

    box-shadow:
        0 0 10px
        rgba(255,214,117,.7);

    opacity:
        0;

    animation:
        particleFly
        1.8s
        ease-out
        forwards;
}

/* =========================================================
   PARTICLE THEMES
========================================================= */

.particle.pink {

    background:
        #ff6f91;

    box-shadow:
        0 0 12px
        rgba(255,91,127,.85);
}


.particle.pink-soft {

    background:
        #ff9eb5;

    box-shadow:
        0 0 14px
        rgba(255,120,150,.8);
}


.particle.gold {

    background:
        #ffd675;

    box-shadow:
        0 0 13px
        rgba(255,214,117,.9);
}


.particle.mega {

    background:
        #ffe9a8;

    box-shadow:

        0 0 12px
        rgba(255,220,120,1),

        0 0 24px
        rgba(255,180,60,.75);
}


@keyframes particleFly {

    0% {

        opacity:
            0;

        transform:
            translateY(25px)
            scale(.3);
    }

    15% {

        opacity:
            1;
    }

    100% {

        opacity:
            0;

        transform:
            translateY(-190px)
            scale(1.25);
    }
}


/* =========================================================
   MOBILE / SMALL CANVAS
========================================================= */

@media (max-width:750px) {

    .alert-wrap {

        bottom:
            40px;

        width:
            calc(100vw - 24px);
    }


    .alert-card {

        grid-template-columns:
            70px
            minmax(0,1fr);

        gap:
            14px;

        min-height:
            125px;

        padding:
            17px;
    }


    .avatar {

        width:
            64px;

        height:
            64px;

        border-radius:
            18px;

        font-size:
            25px;
    }


    .donation-label {

        font-size:
            10px;
    }


    .donor-name {

        font-size:
            23px;
    }


    .message {

        font-size:
            14px;
    }


    .amount-box {

        grid-column:
            2;

        min-width:
            0;

        padding-left:
            0;

        text-align:
            left;
    }


    .amount {

        font-size:
            29px;
    }


    .currency {

        display:
            none;
    }


    .mega-text {

        bottom:
            175px;

        font-size:
            22px;
    }
}

</style>

</head>


<body>


<div class="stage">


    <div
        class="particles"
        id="particles"
    ></div>



    <div
        class="alert-wrap"
        id="alert-wrap"
    >


        <div
            class="mega-text"
            id="mega-text"
        >
            BIG SUPPORT ❤️
        </div>



        <div class="alert-card">


            <div class="top-accent"></div>


            <div class="alert-glow"></div>



            <div
                class="avatar"
                id="avatar"
            >
                A
            </div>



            <div class="content">


                <div class="label-row">


                    <div
                        class="donation-label"
                        id="donation-label"
                    >
                        NEW DONATION
                    </div>


                    <div
                        class="badge"
                        id="alert-badge"
                    ></div>


                    <div
                        class="badge"
                        id="sound-badge"
                    ></div>


                </div>



                <div
                    class="donor-name"
                    id="donor-name"
                >
                    Anonymous
                </div>

            </div>

                <div

                </div>


                <div class="currency">

                </div>


            </div>

                <div

                    id="progress-fill"
                ></div>

            </div>


        </div>

    </div>

</div>



<!--
ไม่มี src ตายตัวแล้ว
JS จะกำหนดตาม Donation
-->

<audio
    id="alert-sound"
    preload="auto"
></audio>



<script src="/socket.io/socket.io.js"></script>


<script>

/* =========================================================
   CONFIG
========================================================= */

/*
Custom Sound
เล่นสูงสุด 10 วินาที
*/

const CUSTOM_SOUND_MAX_TIME =
    10000;


/*
เสียง Default
กันกรณีไฟล์ยาวผิดปกติ
*/

const DEFAULT_SOUND_MAX_TIME =
    20000;


/*
ระหว่าง Alert A → Alert B
*/

const QUEUE_GAP =
    500;


/* =========================================================
   ALERT SETTINGS DEFAULT

   Server โหลดไม่ได้
   จะใช้ชุดนี้แทน
========================================================= */

let alertSettings = {

    ttsEnabled:
        true,

    readMessage:
        true,

    ttsRate:
        1,

    bigAmount:
        500,

    megaAmount:
        1000,

    afterTtsDelay:
        1000,

    noTtsDisplayTime:
        4500
};


/* =========================================================
   ELEMENTS
========================================================= */

const alertWrap =
    document.getElementById(
        "alert-wrap"
    );


const avatar =
    document.getElementById(
        "avatar"
    );


const donorName =
    document.getElementById(
        "donor-name"
    );


const messageElement =
    document.getElementById(
        "message"
    );


const amountElement =
    document.getElementById(
        "amount"
    );


const donationLabel =
    document.getElementById(
        "donation-label"
    );


const alertBadge =
    document.getElementById(
        "alert-badge"
    );


const soundBadge =
    document.getElementById(
        "sound-badge"
    );


const progressFill =
    document.getElementById(
        "progress-fill"
    );


const particles =
    document.getElementById(
        "particles"
    );


const megaText =
    document.getElementById(
        "mega-text"
    );


const alertSound =
    document.getElementById(
        "alert-sound"
    );


/* =========================================================
   QUEUE
========================================================= */

const donationQueue =
    [];


let playing =
    false;


let currentDonation =
    null;


let progressAnimation =
    null;


/* =========================================================
   SOCKET
========================================================= */

const socket =
    io();


socket.on(
    "connect",

    () => {

        console.log(
            "✅ AMR29 Overlay connected"
        );


        /*
        reconnect เมื่อไร
        โหลด Settings ใหม่
        */

        loadAlertSettings();
    }
);


socket.on(
    "disconnect",

    () => {

        console.log(
            "❌ AMR29 Overlay disconnected"
        );
    }
);


/* =========================================================
   ALERT SETTINGS REALTIME
========================================================= */

socket.on(
    "alert-settings-update",

    settings => {

        if (
            !settings
        ) {

            return;
        }


        applyAlertSettings(
            settings
        );


        console.log(
            "🔔 Alert Settings updated:",
            alertSettings
        );
    }
);


/* =========================================================
   LOAD ALERT SETTINGS
========================================================= */

async function loadAlertSettings() {

    try {

        const response =
            await fetch(
                "/api/alert-settings",
                {
                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok

            ||

            !data.success

            ||

            !data.settings
        ) {

            throw new Error(
                data.message
                ||
                "โหลด Alert Settings ไม่สำเร็จ"
            );
        }


        applyAlertSettings(
            data.settings
        );


        console.log(
            "🔔 Alert Settings loaded:",
            alertSettings
        );


    } catch (error) {

        console.warn(
            "Alert Settings:",
            error
        );


        console.warn(
            "ใช้ Default Settings:",
            alertSettings
        );
    }
}


/* =========================================================
   APPLY SETTINGS
========================================================= */

function applyAlertSettings(
    settings = {}
) {

    const ttsRate =
        Number(
            settings.ttsRate
        );


    const bigAmount =
        Number(
            settings.bigAmount
        );


    const megaAmount =
        Number(
            settings.megaAmount
        );


    const afterTtsDelay =
        Number(
            settings.afterTtsDelay
        );


    const noTtsDisplayTime =
        Number(
            settings.noTtsDisplayTime
        );


    alertSettings = {

        ttsEnabled:

            typeof settings.ttsEnabled ===
            "boolean"

                ?

                settings.ttsEnabled

                :

                alertSettings.ttsEnabled,


        readMessage:

            typeof settings.readMessage ===
            "boolean"

                ?

                settings.readMessage

                :

                alertSettings.readMessage,


        ttsRate:

            Number.isFinite(
                ttsRate
            )

            &&

            ttsRate >= .5

            &&

            ttsRate <= 2

                ?

                ttsRate

                :

                alertSettings.ttsRate,


        bigAmount:

            Number.isFinite(
                bigAmount
            )

            &&

            bigAmount > 0

                ?

                bigAmount

                :

                alertSettings.bigAmount,


        megaAmount:

            Number.isFinite(
                megaAmount
            )

            &&

            megaAmount > 0

                ?

                megaAmount

                :

                alertSettings.megaAmount,


        afterTtsDelay:

            Number.isFinite(
                afterTtsDelay
            )

            &&

            afterTtsDelay >= 0

                ?

                afterTtsDelay

                :

                alertSettings.afterTtsDelay,


        noTtsDisplayTime:

            Number.isFinite(
                noTtsDisplayTime
            )

            &&

            noTtsDisplayTime >= 1000

                ?

                noTtsDisplayTime

                :

                alertSettings.noTtsDisplayTime
    };


    /*
    Mega ต้องมากกว่า Big
    */

    if (
        alertSettings.megaAmount <=
        alertSettings.bigAmount
    ) {

        alertSettings.megaAmount =
            alertSettings.bigAmount +
            1;
    }
}


/* =========================================================
   SOUND TIER FALLBACK

   ต้องตรง server.js
========================================================= */

function getTierSoundUrl(
    amount
) {

    const value =
        Number(
            amount
        )
        ||
        0;


    if (
        value >=
        1000
    ) {

        return "/sounds/alert5.mp3";
    }


    if (
        value >=
        500
    ) {

        return "/sounds/alert5.mp3";
    }


    if (
        value >=
        300
    ) {

        return "/sounds/alert4.mp3";
    }


    if (
        value >=
        100
    ) {

        return "/sounds/alert3.mp3";
    }


    if (
        value >=
        50
    ) {

        return "/sounds/alert2.mp3";
    }


    return "/sounds/alert.mp3";
}


/* =========================================================
   VALIDATE SOUND URL

   ป้องกัน Overlay เล่น URL แปลก ๆ
========================================================= */

function sanitizeSoundUrl(
    soundUrl,
    amount
) {

    const fallback =
        getTierSoundUrl(
            amount
        );


    if (
        typeof soundUrl !==
        "string"
    ) {

        return fallback;
    }


    const value =
        soundUrl.trim();


    /*
    Default sound files
    */

    const allowedTierSounds = [

        "/sounds/alert.mp3",

        "/sounds/alert2.mp3",

        "/sounds/alert3.mp3",

        "/sounds/alert4.mp3",

        "/sounds/alert5.mp3",

        "/sounds/alert6.mp3"
    ];


    if (
        allowedTierSounds.includes(
            value
        )
    ) {

        return value;
    }


    /*
    Custom Sound Endpoint

    /api/custom-sound/
    snd_xxxxx/audio
    */

    if (
        /^\/api\/custom-sound\/snd_[a-f0-9]{48}\/audio$/
        .test(
            value
        )
    ) {

        return value;
    }


    console.warn(
        "Blocked invalid soundUrl:",
        value
    );


    return fallback;
}


/* =========================================================
   RECEIVE DONATION
========================================================= */

socket.on(
    "donation",

    donation => {

        if (
            !donation
        ) {

            return;
        }


        const amount =
            Number(
                donation.amount
            );


        if (
            !Number.isFinite(
                amount
            )

            ||

            amount <= 0
        ) {

            return;
        }


        const soundUrl =
            sanitizeSoundUrl(

                donation.soundUrl,

                amount
            );


        donationQueue.push({

            name:

                String(
                    donation.name
                    ||
                    "Anonymous"
                )
                .trim()
                .slice(
                    0,
                    30
                ),


            message:

                String(
                    donation.message
                    ||
                    ""
                )
                .trim()
                .slice(
                    0,
                    200
                ),


            amount,


            soundUrl,


            soundTier:

                String(
                    donation.soundTier
                    ||
                    ""
                )
                .slice(
                    0,
                    30
                ),


            customSound:

                Boolean(
                    donation.customSound
                ),


            isTest:

                Boolean(
                    donation.isTest
                    ||
                    donation.test
                ),


            isReplay:

                Boolean(
                    donation.isReplay
                    ||
                    donation.replay
                )
        });


        console.log(
            "💸 Donation queued:",
            {
                amount,
                soundUrl,
                customSound:
                    Boolean(
                        donation.customSound
                    ),
                queue:
                    donationQueue.length
            }
        );


        playNextDonation();
    }
);


/* =========================================================
   QUEUE PLAYER
========================================================= */

async function playNextDonation() {

    if (
        playing

        ||

        donationQueue.length ===
        0
    ) {

        return;
    }


    playing =
        true;


    currentDonation =
        donationQueue.shift();


    try {

        await showDonation(
            currentDonation
        );


    } catch (error) {

        console.error(
            "Alert Error:",
            error
        );


    } finally {

        hideAlert();


        await delay(
            QUEUE_GAP
        );


        playing =
            false;


        currentDonation =
            null;


        playNextDonation();
    }
}

    const settings = {

    /* =====================================================

if (

    );


    donationLabel.innerText =

    createParticles(

        "gold"
    );


} else if (

) {

    ========================= */

    createParticles(
        20,
        "pink"
    );


} else if (
    amount >=

) {

    /* =========================
       100 - 299
    ========================= */

    donationLabel.innerText =
        "NEW DONATION";


    createParticles(
        12,
        "pink-soft"
    );


} else {

    /* =========================
       ต่ำกว่า 100
    ========================= */

    donationLabel.innerText =
        "NEW DONATION";
}


    /* =====================================================
       TEST / REPLAY
    ====================================================== */

    alertBadge.className =
        "badge";


    alertBadge.innerText =
        "";


    if (
        donation.isTest
    ) {

        alertBadge.classList.add(
            "test"
        );


        alertBadge.innerText =
            "TEST";


    } else if (
        donation.isReplay
    ) {

        alertBadge.classList.add(
            "replay"
        );


        alertBadge.innerText =
            "REPLAY";
    }


    /* =====================================================
       CUSTOM SOUND BADGE
    ====================================================== */

    soundBadge.className =
        "badge";


    soundBadge.innerText =
        "";


    if (
        donation.customSound
    ) {

        alertWrap.classList.add(
            "custom-sound"
        );


        soundBadge.classList.add(
            "custom"
        );


        soundBadge.innerText =
            "🎧 CUSTOM SOUND";
    }


    /* =====================================================
       DATA
    ====================================================== */

    const name =

        donation.name

        ||

        "Anonymous";


    donorName.innerText =
        name;


    avatar.innerText =
        getFirstCharacter(
            name
        );


    amountElement.innerText =

        "฿"

        +

        amount.toLocaleString(
            "th-TH",
            {
                maximumFractionDigits:
                    2
            }
        );


    /* =====================================================
       MESSAGE
    ====================================================== */

    if (
        donation.message
    ) {

        messageElement.style.display =
            "-webkit-box";


        messageElement.innerText =
            donation.message;


    } else {

        messageElement.style.display =
            "none";


        messageElement.innerText =
            "";
    }


    /* =====================================================
       SHOW
    ====================================================== */

    alertWrap.classList.remove(
        "hiding"
    );


    void alertWrap.offsetWidth;


    alertWrap.classList.add(
        "show"
    );


    /*
    ให้ Animation ขึ้นก่อนเสียงนิดนึง
    */

    await delay(
        180
    );


    /* =====================================================
       SOUND

       donation.soundUrl
       ↓
       Custom / Tier
       ↓
       ถ้าพัง fallback Tier
    ====================================================== */

    await playDonationSound(
        donation
    );


    /* =====================================================
       TTS
    ====================================================== */

    const speechText =
        createSpeechText(
            donation,
            settings
        );


    if (
        settings.ttsEnabled

        &&

        speechText
    ) {

        const estimatedTime =
            estimateSpeechDuration(

                speechText,

                settings.ttsRate
            );


        startProgress(

            estimatedTime

            +

            settings.afterTtsDelay
        );


        await speak(

            speechText,

            settings.ttsRate
        );


        await delay(
            settings.afterTtsDelay
        );


    } else {

        startProgress(
            settings.noTtsDisplayTime
        );


        await delay(
            settings.noTtsDisplayTime
        );
    }
}


/* =========================================================
   PLAY DONATION SOUND
========================================================= */

async function playDonationSound(
    donation
) {

    const fallbackUrl =
        getTierSoundUrl(
            donation.amount
        );


    const primaryUrl =
        sanitizeSoundUrl(

            donation.soundUrl,

            donation.amount
        );


    const isCustom =
        Boolean(
            donation.customSound
        );


    const maxTime =

        isCustom

            ?

            CUSTOM_SOUND_MAX_TIME

            :

            DEFAULT_SOUND_MAX_TIME;


    console.log(
        "🔊 Alert Sound:",
        {
            primaryUrl,
            fallbackUrl,
            custom:
                isCustom
        }
    );


    try {

        await playAudioSource(

            primaryUrl,

            maxTime
        );


        return;


    } catch (error) {

        console.warn(
            "Primary Alert Sound failed:",
            primaryUrl,
            error
        );
    }


    /* =====================================================
       FALLBACK

       Custom เสีย / 404 / เล่นไม่ได้
       → เสียงตามยอด
    ====================================================== */

    if (
        primaryUrl !==
        fallbackUrl
    ) {

        console.log(
            "🔄 Fallback Sound:",
            fallbackUrl
        );


        try {

            await playAudioSource(

                fallbackUrl,

                DEFAULT_SOUND_MAX_TIME
            );


        } catch (error) {

            console.warn(
                "Fallback Sound failed:",
                error
            );
        }
    }
}


/* =========================================================
   PLAY AUDIO SOURCE
========================================================= */

async function playAudioSource(
    source,
    maxPlaybackTime
) {

    stopAlertAudio();


    alertSound.src =
        source;


    alertSound.currentTime =
        0;


    alertSound.load();


    try {

        const playPromise =
            alertSound.play();


        if (
            playPromise

            &&

            typeof playPromise.then ===
            "function"
        ) {

            await playPromise;
        }


    } catch (error) {

        throw new Error(
            "เปิดไฟล์เสียงไม่ได้: "
            +
            source
        );
    }


    await waitForAudioEnd(

        alertSound,

        maxPlaybackTime
    );
}


/* =========================================================
   WAIT AUDIO END

   หมดเวลา = หยุดเสียงแล้วไป TTS ต่อ
========================================================= */

function waitForAudioEnd(
    audio,
    maxPlaybackTime
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            let finished =
                false;


            let timer =
                null;


            const cleanup =
                () => {

                    audio.removeEventListener(
                        "ended",
                        onEnded
                    );


                    audio.removeEventListener(
                        "error",
                        onError
                    );


                    if (
                        timer
                    ) {

                        clearTimeout(
                            timer
                        );
                    }
                };


            const finish =
                () => {

                    if (
                        finished
                    ) {

                        return;
                    }


                    finished =
                        true;


                    cleanup();


                    resolve();
                };


            const fail =
                error => {

                    if (
                        finished
                    ) {

                        return;
                    }


                    finished =
                        true;


                    cleanup();


                    reject(
                        error
                    );
                };


            const onEnded =
                () => {

                    finish();
                };


            const onError =
                () => {

                    fail(
                        new Error(
                            "Audio playback error"
                        )
                    );
                };


            audio.addEventListener(
                "ended",
                onEnded,
                {
                    once:
                        true
                }
            );


            audio.addEventListener(
                "error",
                onError,
                {
                    once:
                        true
                }
            );


            timer =
                setTimeout(
                    () => {

                        /*
                        ไฟล์ยาวเกินกำหนด
                        ตัดตรงนี้
                        */

                        try {

                            audio.pause();

                            audio.currentTime =
                                0;

                        } catch {}


                        finish();

                    },

                    Math.max(
                        1000,
                        Number(
                            maxPlaybackTime
                        )
                        ||
                        10000
                    )
                );
        }
    );
}


/* =========================================================
   STOP AUDIO
========================================================= */

function stopAlertAudio() {

    try {

        alertSound.pause();


        alertSound.currentTime =
            0;


    } catch {}
}


/* =========================================================
   TTS TEXT
========================================================= */

function createSpeechText(
    donation,
    settings
) {

    const name =

        donation.name

        ||

        "Anonymous";


    let text =

        `${name} สนับสนุน ${formatAmountForSpeech(
            donation.amount
        )} บาท`;


    if (
        settings.readMessage

        &&

        donation.message
    ) {

        text +=

            ` ข้อความว่า ${donation.message}`;
    }


    return text;
}


/* =========================================================
   SPEAK
========================================================= */

function speak(
    text,
    rate = 1
) {

    return new Promise(
        resolve => {

            if (
                !window.speechSynthesis

                ||

                !text
            ) {

                resolve();

                return;
            }


            window
                .speechSynthesis
                .cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );


            utterance.lang =
                "th-TH";


            utterance.rate =
                Math.max(

                    .5,

                    Math.min(
                        2,
                        Number(
                            rate
                        )
                        ||
                        1
                    )
                );


            utterance.pitch =
                1;


            utterance.volume =
                1;


            let finished =
                false;


            let timeoutId =
                null;


            const finish =
                () => {

                    if (
                        finished
                    ) {

                        return;
                    }


                    finished =
                        true;


                    if (
                        timeoutId
                    ) {

                        clearTimeout(
                            timeoutId
                        );
                    }


                    resolve();
                };


            utterance.onend =
                finish;


            utterance.onerror =
                finish;


            window
                .speechSynthesis
                .speak(
                    utterance
                );


            /*
            กัน OBS/Chrome บางเครื่อง
            ไม่ยิง onend
            */

            timeoutId =
                setTimeout(

                    finish,

                    Math.max(

                        5000,

                        estimateSpeechDuration(
                            text,
                            utterance.rate
                        )

                        +

                        4000
                    )
                );
        }
    );
}


/* =========================================================
   ESTIMATE SPEECH
========================================================= */

function estimateSpeechDuration(
    text,
    rate = 1
) {

    const characters =
        String(
            text
            ||
            ""
        )
        .length;


    const safeRate =
        Math.max(

            .5,

            Number(
                rate
            )
            ||
            1
        );


    const duration =

        (
            characters /
            11 *
            1000
        )

        /

        safeRate;


    return Math.max(

        2200,

        Math.min(
            20000,
            duration
        )
    );
}


/* =========================================================
   PROGRESS
========================================================= */

function startProgress(
    duration
) {

    if (
        progressAnimation
    ) {

        progressAnimation.cancel();


        progressAnimation =
            null;
    }


    progressFill.style.transform =
        "scaleX(1)";


    progressAnimation =
        progressFill.animate(

            [

                {
                    transform:
                        "scaleX(1)"
                },

                {
                    transform:
                        "scaleX(0)"
                }

            ],

            {

                duration:

                    Math.max(
                        500,
                        duration
                    ),

                easing:
                    "linear",

                fill:
                    "forwards"
            }
        );
}


/* =========================================================
   HIDE ALERT
========================================================= */

function hideAlert() {

    if (
        progressAnimation
    ) {

        progressAnimation.cancel();


        progressAnimation =
            null;
    }


    alertWrap.classList.add(
        "hiding"
    );


    alertWrap.classList.remove(
        "show"
    );


    if (
        window.speechSynthesis
    ) {

        window
            .speechSynthesis
            .cancel();
    }


    stopAlertAudio();
}


/* =========================================================
   RESET
========================================================= */

function resetAlertClasses() {

    alertWrap.classList.remove(

        "big",

        "mega",

        "custom-sound",

        "show",

        "hiding"
    );


    particles.innerHTML =
        "";


    alertBadge.className =
        "badge";


    alertBadge.innerText =
        "";


    soundBadge.className =
        "badge";


    soundBadge.innerText =
        "";


    if (
        progressAnimation
    ) {

        progressAnimation.cancel();


        progressAnimation =
            null;
    }


    progressFill.style.transform =
        "scaleX(1)";
}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    amount,
    theme = "pink"
) {

    particles.innerHTML =
        "";


    for (
        let index = 0;
        index < amount;
        index++
    ) {

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            `particle ${theme}`;


        /* =================================================
           ตำแหน่งแนวนอน

           กระจายรอบ Alert
        ================================================= */

        particle.style.left =

            (
                18

                +

                Math.random() *
                64
            )

            +

            "%";


        /* =================================================
           เริ่มจากบริเวณล่าง Alert
        ================================================= */

        particle.style.bottom =

            (
                70

                +

                Math.random() *
                115
            )

            +

            "px";


        /* =================================================
           DELAY
        ================================================= */

        particle.style.animationDelay =

            (
                Math.random() *
                .65
            )

            +

            "s";


        /* =================================================
           SPEED
        ================================================= */

        particle.style.animationDuration =

            (
                1.15

                +

                Math.random() *
                1.25
            )

            +

            "s";


        /* =================================================
           SIZE

           MEGA ใหญ่ขึ้น
        ================================================= */

        let minSize =
            4;


        let randomSize =
            6;


        if (
            theme ===
            "gold"
        ) {

            minSize =
                5;


            randomSize =
                7;
        }


        if (
            theme ===
            "mega"
        ) {

            minSize =
                6;


            randomSize =
                9;
        }


        const size =

            minSize

            +

            Math.random() *
            randomSize;


        particle.style.width =

            size

            +

            "px";


        particle.style.height =

            size

            +

            "px";


        /* =================================================
           RANDOM ROUNDNESS

           บางเม็ดกลม
           บางเม็ดคล้าย Confetti
        ================================================= */

        if (
            Math.random() >
            .55
        ) {

            particle.style
                .borderRadius =
                "2px";


            particle.style
                .transform =
                `rotate(${Math.random() * 360}deg)`;

        } else {

            particle.style
                .borderRadius =
                "50%";
        }


        particles.appendChild(
            particle
        );
    }
}

/* =========================================================
   FIRST CHARACTER
========================================================= */

function getFirstCharacter(
    value
) {

    const text =
        String(
            value
            ||
            "A"
        )
        .trim();


    if (
        !text
    ) {

        return "A";
    }


    return Array.from(
        text
    )[0]
    .toUpperCase();
}


/* =========================================================
   SPEECH AMOUNT
========================================================= */

function formatAmountForSpeech(
    amount
) {

    return Number(
        amount
        ||
        0
    )
    .toLocaleString(
        "th-TH"
    );
}


/* =========================================================
   DELAY
========================================================= */

function delay(
    milliseconds
) {

    return new Promise(

        resolve =>

            setTimeout(
                resolve,
                milliseconds
            )
    );
}
