<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMR29 Donation Alert</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --accent:#ff5b7f;
    --accent-light:#ff9ab0;
    --gold:#ffd36e;
    --success:#63df9b;
    --text:#ffffff;
    --text-soft:#f3f3f6;
    --text-muted:#b7b7c1;
    --panel:rgba(8,8,13,.97);
    --border:rgba(255,255,255,.20);
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:transparent;
    font-family:
        "Segoe UI",
        "Noto Sans Thai",
        Arial,
        sans-serif;
}

body{
    user-select:none;
}

.stage{
    position:fixed;
    inset:0;
    pointer-events:none;
}


/* =========================================================
   VIDEO
========================================================= */

.video-wrap{
    position:absolute;

    left:50%;
    bottom:70px;

    width:
        min(
            760px,
            calc(100vw - 70px)
        );

    transform:
        translateX(-50%)
        translateY(24px)
        scale(.97);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .24s ease,
        transform .42s cubic-bezier(.16,1,.3,1),
        visibility .24s ease;
}

.video-wrap.show{
    opacity:1;
    visibility:visible;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);
}

.video-wrap.hiding{
    opacity:0;

    transform:
        translateX(-50%)
        translateY(18px)
        scale(.98);
}

.video-shell{
    position:relative;

    overflow:hidden;

    width:100%;

    aspect-ratio:
        16 / 9;

    border:
        2px solid
        rgba(255,255,255,.16);

    border-radius:22px;

    background:#000;

    box-shadow:
        0 28px 90px
        rgba(0,0,0,.78),

        0 0 45px
        rgba(120,202,255,.10);
}

.video-shell::before{
    content:"";

    position:absolute;

    z-index:5;

    left:26px;
    right:26px;
    top:0;

    height:3px;

    border-radius:
        0 0 999px 999px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #58bfff,
            #aee6ff,
            transparent
        );
}

#video-player{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    background:#000;
}

#video-player iframe{
    display:block;

    width:100% !important;
    height:100% !important;

    border:0;
}

.video-progress{
    position:absolute;

    z-index:8;

    left:0;
    right:0;
    bottom:0;

    height:5px;

    overflow:hidden;

    background:
        rgba(255,255,255,.16);
}

.video-progress-fill{
    width:100%;
    height:100%;

    transform-origin:
        left center;

    background:
        linear-gradient(
            90deg,
            #4eb8ff,
            #8ad9ff,
            #d4f4ff
        );

    box-shadow:
        0 0 12px
        rgba(120,202,255,.70);
}


/* =========================================================
   NORMAL DONATION
========================================================= */

.alert-wrap{
    position:absolute;

    left:50%;
    bottom:95px;

    width:
        min(
            780px,
            calc(100vw - 70px)
        );

    transform:
        translateX(-50%);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .22s ease;
}

.alert-wrap.show{
    opacity:1;
    visibility:visible;
}

.alert-card{
    position:relative;

    overflow:hidden;

    display:grid;

    grid-template-columns:
        96px
        minmax(0,1fr)
        auto;

    align-items:center;

    gap:22px;

    min-height:148px;

    padding:
        22px 27px;

    border:
        2px solid
        var(--border);

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            rgba(255,91,127,.055),
            rgba(255,255,255,.015)
        ),
        var(--panel);

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.72),

        0 3px 0
        rgba(255,255,255,.025)
        inset;

    transform:
        translateY(32px)
        scale(.95);

    opacity:0;

    transition:
        transform
        .5s
        cubic-bezier(.16,1,.3,1),

        opacity
        .3s
        ease;
}

.alert-wrap.show
.alert-card{
    transform:
        translateY(0)
        scale(1);

    opacity:1;
}

.alert-wrap.hiding
.alert-card{
    transform:
        translateY(22px)
        scale(.97);

    opacity:0;
}

.top-accent{
    position:absolute;

    left:26px;
    right:26px;
    top:0;

    height:3px;

    border-radius:
        0 0 999px 999px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--accent),
            var(--accent-light),
            transparent
        );
}

.alert-glow{
    position:absolute;

    width:300px;
    height:300px;

    left:-130px;
    top:-130px;

    border-radius:50%;

    background:
        rgba(255,91,127,.17);

    filter:
        blur(65px);

    pointer-events:none;
}

.avatar{
    position:relative;

    z-index:2;

    width:86px;
    height:86px;

    display:flex;

    justify-content:center;
    align-items:center;

    flex-shrink:0;

    border:
        2px solid
        rgba(255,91,127,.38);

    border-radius:23px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            rgba(255,91,127,.32),
            rgba(255,91,127,.13)
        );

    font-size:34px;
    font-weight:900;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,.8);

    box-shadow:
        0 12px 30px
        rgba(255,91,127,.17),

        0 0 0 1px
        rgba(255,255,255,.045)
        inset;
}

.content{
    position:relative;

    z-index:2;

    min-width:0;
}

.label-row{
    display:flex;

    align-items:center;

    gap:8px;

    margin-bottom:5px;
}

.donation-label{
    color:
        var(--accent-light);

    font-size:13px;
    font-weight:900;

    letter-spacing:1.5px;

    text-shadow:
        0 2px 6px
        rgba(0,0,0,.9);
}

.badge{
    display:none;

    padding:
        4px 8px;

    border-radius:999px;

    font-size:9px;
    font-weight:900;

    letter-spacing:.8px;
}

.badge.test{
    display:inline-flex;

    color:#ffd08a;

    background:
        rgba(255,191,105,.14);

    border:
        1px solid
        rgba(255,191,105,.28);
}

.badge.replay{
    display:inline-flex;

    color:#c2c2ff;

    background:
        rgba(155,155,255,.14);

    border:
        1px solid
        rgba(155,155,255,.27);
}

.donor-name{
    max-width:100%;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

    color:#fff;

    font-size:32px;
    line-height:1.15;

    font-weight:900;

    letter-spacing:-.5px;

    text-shadow:
        0 3px 8px
        rgba(0,0,0,.95),

        0 1px 2px
        #000;
}

.message{
    max-width:100%;

    margin-top:8px;

    overflow:hidden;

    display:-webkit-box;

    -webkit-box-orient:
        vertical;

    -webkit-line-clamp:2;

    line-clamp:2;

    color:#f7f7f9;

    font-size:18px;
    font-weight:650;

    line-height:1.4;

    text-shadow:
        0 3px 7px
        rgba(0,0,0,.95),

        0 1px 2px
        #000;
}

.amount-box{
    position:relative;

    z-index:2;

    min-width:170px;

    padding-left:15px;

    text-align:right;
}

.amount{
    color:#ff9eb3;

    font-size:43px;

    line-height:1;

    font-weight:900;

    letter-spacing:-1.2px;

    white-space:nowrap;

    text-shadow:
        0 4px 12px
        rgba(0,0,0,.95),

        0 0 20px
        rgba(255,91,127,.26);
}

.currency{
    margin-top:7px;

    color:#d0d0d7;

    font-size:11px;
    font-weight:900;

    letter-spacing:2px;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,.9);
}

.progress{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:5px;

    overflow:hidden;

    background:
        rgba(255,255,255,.09);
}

.progress-fill{
    width:100%;
    height:100%;

    transform-origin:
        left center;

    background:
        linear-gradient(
            90deg,
            #ff3e69,
            #ff6f90,
            #ffa1b5
        );

    box-shadow:
        0 0 12px
        rgba(255,91,127,.55);
}


/* =========================================================
   BIG / MEGA
========================================================= */

.alert-wrap.big
.alert-card{
    border-color:
        rgba(255,211,110,.42);

    background:
        linear-gradient(
            135deg,
            rgba(255,196,78,.10),
            rgba(255,255,255,.015)
        ),
        rgba(8,8,12,.98);

    box-shadow:
        0 28px 90px
        rgba(0,0,0,.72),

        0 0 45px
        rgba(255,195,80,.15);
}

.alert-wrap.big
.top-accent{
    background:
        linear-gradient(
            90deg,
            transparent,
            #ffb74d,
            #ffe293,
            transparent
        );
}

.alert-wrap.big
.alert-glow{
    background:
        rgba(255,190,70,.24);
}

.alert-wrap.big
.avatar{
    color:#fff6d8;

    border-color:
        rgba(255,211,110,.52);

    background:
        linear-gradient(
            145deg,
            rgba(255,197,75,.32),
            rgba(255,170,50,.12)
        );

    box-shadow:
        0 12px 36px
        rgba(255,190,70,.18);
}

.alert-wrap.big
.donation-label{
    color:
        var(--gold);
}

.alert-wrap.big
.amount{
    color:
        var(--gold);

    text-shadow:
        0 4px 12px
        rgba(0,0,0,.95),

        0 0 22px
        rgba(255,200,80,.28);
}

.alert-wrap.big
.progress-fill{
    background:
        linear-gradient(
            90deg,
            #ffa833,
            #ffd36e,
            #fff0bb
        );

    box-shadow:
        0 0 12px
        rgba(255,205,90,.60);
}

.alert-wrap.mega
.alert-card{
    animation:
        megaPulse
        1.25s
        ease-in-out
        infinite
        alternate;
}

@keyframes megaPulse{

    from{
        box-shadow:
            0 28px 90px
            rgba(0,0,0,.72),

            0 0 30px
            rgba(255,195,75,.13);
    }

    to{
        box-shadow:
            0 28px 90px
            rgba(0,0,0,.72),

            0 0 65px
            rgba(255,195,75,.31);
    }
}

.mega-text{
    position:absolute;

    left:50%;
    bottom:200px;

    transform:
        translateX(-50%)
        translateY(18px)
        scale(.90);

    color:#ffe190;

    text-align:center;

    font-size:30px;
    font-weight:900;

    letter-spacing:4px;

    white-space:nowrap;

    opacity:0;

    transition:
        .45s
        cubic-bezier(.16,1,.3,1);

    text-shadow:
        0 4px 15px
        rgba(0,0,0,.9),

        0 0 30px
        rgba(255,195,80,.42);
}

.alert-wrap.mega.show
.mega-text{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);
}


/* =========================================================
   PARTICLES
========================================================= */

.particles{
    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;
}

.particle{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ffd675;

    box-shadow:
        0 0 10px
        rgba(255,214,117,.7);

    opacity:0;

    animation:
        particleFly
        1.8s
        ease-out
        forwards;
}

@keyframes particleFly{

    0%{
        opacity:0;

        transform:
            translateY(25px)
            scale(.3);
    }

    15%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translateY(-190px)
            scale(1.25);
    }
}

/* =========================================================
   VIDEO DONATION UI PRO MAX
========================================================= */

.video-top-shine{
    content:"";
    position:absolute;
    z-index:7;
    left:18px;
    right:18px;
    top:0;
    height:3px;
    border-radius:0 0 999px 999px;
    background:linear-gradient(
        90deg,
        transparent,
        #ff7ea1,
        #8cdcff,
        transparent
    );
    box-shadow:
        0 0 18px rgba(255,126,161,.35),
        0 0 24px rgba(140,220,255,.25);
}

.video-donation-ui{
    position:absolute;
    inset:0;
    z-index:9;
    pointer-events:none;
    opacity:0;
    transform:translateY(16px) scale(.98);
    transition:
        opacity .35s ease,
        transform .45s cubic-bezier(.16,1,.3,1);
}

.video-donation-ui.show{
    opacity:1;
    transform:translateY(0) scale(1);
}

.video-donation-backdrop{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.06) 0%,
            rgba(0,0,0,.00) 25%,
            rgba(0,0,0,.18) 100%
        );
    pointer-events:none;
}

.video-donation-card{
    position:absolute;
    left:20px;
    right:20px;
    bottom:18px;
    min-height:112px;
    padding:16px 18px 16px 18px;
    border-radius:22px;
    border:1px solid rgba(255,255,255,.16);
    background:
        linear-gradient(
            135deg,
            rgba(255,91,127,.16),
            rgba(112,203,255,.10)
        ),
        rgba(8,8,14,.78);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:
        0 16px 50px rgba(0,0,0,.38),
        0 0 0 1px rgba(255,255,255,.03) inset;
}

.video-donation-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:8px;
}

.video-donation-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 12px;
    border-radius:999px;
    color:#ffd8e3;
    font-size:11px;
    font-weight:900;
    letter-spacing:1.2px;
    background:rgba(255,91,127,.14);
    border:1px solid rgba(255,91,127,.22);
    text-shadow:0 2px 6px rgba(0,0,0,.6);
}

.video-donation-amount{
    color:#ffe18f;
    font-size:30px;
    font-weight:900;
    line-height:1;
    white-space:nowrap;
    letter-spacing:-.8px;
    text-shadow:
        0 3px 8px rgba(0,0,0,.85),
        0 0 18px rgba(255,210,100,.26);
}

.video-donation-name{
    color:#ffffff;
    font-size:28px;
    font-weight:900;
    line-height:1.15;
    letter-spacing:-.4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow:
        0 3px 8px rgba(0,0,0,.9),
        0 1px 2px rgba(0,0,0,.9);
}

.video-donation-message{
    margin-top:8px;
    color:#f5f7ff;
    font-size:17px;
    font-weight:700;
    line-height:1.4;
    text-shadow:
        0 3px 7px rgba(0,0,0,.9),
        0 1px 2px rgba(0,0,0,.9);

    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    line-clamp:2;
    overflow:hidden;
    word-break:break-word;
}

.video-donation-message.hide{
    display:none;
}

/* เพิ่ม glow เวลาวิดีโอโชว์ */
.video-wrap.show .video-shell{
    box-shadow:
        0 28px 90px rgba(0,0,0,.78),
        0 0 50px rgba(255,91,127,.10),
        0 0 50px rgba(120,202,255,.10);
}

/* =========================================================
   RESPONSIVE - VIDEO DONATION UI
========================================================= */

@media(max-width:750px){

    .video-donation-card{
        left:10px;
        right:10px;
        bottom:10px;
        min-height:86px;
        padding:12px 12px 12px 12px;
        border-radius:16px;
    }

    .video-donation-pill{
        font-size:9px;
        padding:6px 9px;
    }

    .video-donation-amount{
        font-size:20px;
    }

    .video-donation-name{
        font-size:19px;
    }

    .video-donation-message{
        margin-top:6px;
        font-size:12px;
        line-height:1.35;
        -webkit-line-clamp:2;
        line-clamp:2;
    }
}


/* =========================================================
   NORMAL DONATION GIF — ANYA WOW PRO MAX
   แสดงเฉพาะ Donation ที่ "ไม่มีวิดีโอ"
========================================================= */

.normal-gif-stage{
    position:absolute;
    z-index:12;

    left:50%;
    top:-168px;

    width:220px;
    height:185px;

    transform:
        translateX(-50%)
        translateY(34px)
        scale(.64)
        rotate(-5deg);

    transform-origin:
        center bottom;

    opacity:0;
    visibility:hidden;

    transition:
        opacity .28s ease,
        transform .58s cubic-bezier(.16,1,.3,1),
        visibility .28s ease;

    pointer-events:none;
}

.normal-gif-stage.active{
    opacity:1;
    visibility:visible;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1)
        rotate(0deg);
}

.normal-gif-stage.hide{
    opacity:0;
    visibility:hidden;

    transform:
        translateX(-50%)
        translateY(20px)
        scale(.82)
        rotate(3deg);
}

.normal-gif-glow{
    position:absolute;

    left:50%;
    bottom:18px;

    width:170px;
    height:85px;

    transform:
        translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,91,127,.34) 0%,
            rgba(255,125,165,.18) 38%,
            rgba(255,91,127,0) 72%
        );

    filter:
        blur(14px);

    animation:
        normalGifGlow
        1.35s
        ease-in-out
        infinite
        alternate;
}

.normal-gif-ring{
    position:absolute;

    left:50%;
    bottom:24px;

    width:145px;
    height:55px;

    transform:
        translateX(-50%)
        scale(.6);

    border:
        2px solid
        rgba(255,155,185,.46);

    border-radius:50%;

    opacity:0;

    animation:
        normalGifRing
        1.7s
        ease-out
        infinite;
}

.normal-gif-ring.r2{
    animation-delay:
        .58s;
}

.normal-gif-image{
    position:absolute;

    z-index:3;

    left:50%;
    bottom:8px;

    width:190px;
    height:170px;

    object-fit:contain;

    transform:
        translateX(-50%);

    transform-origin:
        center bottom;

    filter:
        drop-shadow(
            0 15px 18px
            rgba(0,0,0,.48)
        )
        drop-shadow(
            0 0 14px
            rgba(255,100,145,.18)
        );

    animation:
        normalGifBob
        1.45s
        cubic-bezier(.45,.05,.55,.95)
        infinite
        alternate;
}

.normal-gif-spark{
    position:absolute;
    z-index:4;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#fff1b7;

    box-shadow:
        0 0 9px rgba(255,239,171,.95),
        0 0 18px rgba(255,127,163,.60);

    opacity:0;

    animation:
        normalGifSpark
        1.5s
        ease-in-out
        infinite;
}

.normal-gif-spark.s1{
    left:22px;
    top:63px;
    animation-delay:.08s;
}

.normal-gif-spark.s2{
    right:27px;
    top:36px;
    animation-delay:.42s;
}

.normal-gif-spark.s3{
    right:17px;
    top:102px;
    width:6px;
    height:6px;
    animation-delay:.78s;
}

.normal-gif-spark.s4{
    left:38px;
    top:25px;
    width:5px;
    height:5px;
    animation-delay:1.05s;
}

.alert-wrap.big
.normal-gif-stage{
    width:235px;
    height:195px;
    top:-178px;
}

.alert-wrap.big
.normal-gif-image{
    width:205px;
    height:180px;

    filter:
        drop-shadow(
            0 16px 20px
            rgba(0,0,0,.50)
        )
        drop-shadow(
            0 0 20px
            rgba(255,208,100,.28)
        );
}

.alert-wrap.big
.normal-gif-glow{
    background:
        radial-gradient(
            ellipse,
            rgba(255,205,85,.40) 0%,
            rgba(255,160,70,.20) 42%,
            rgba(255,190,70,0) 74%
        );
}

.alert-wrap.big
.normal-gif-ring{
    border-color:
        rgba(255,215,115,.62);
}

.alert-wrap.mega
.normal-gif-stage{
    width:255px;
    height:215px;
    top:-195px;

    animation:
        megaGifStage
        1.25s
        ease-in-out
        infinite
        alternate;
}

.alert-wrap.mega
.normal-gif-image{
    width:225px;
    height:200px;
}

@keyframes normalGifBob{
    from{
        transform:
            translateX(-50%)
            translateY(1px)
            rotate(-1.4deg)
            scale(1);
    }

    to{
        transform:
            translateX(-50%)
            translateY(-9px)
            rotate(1.4deg)
            scale(1.025);

/* =========================================================
   VOLUME HELPERS
========================================================= */

function normalizeVolumePercent(
    value,
    fallback = 100
){

    const number =
        Number(
            value
        );


    if(
        !Number.isFinite(
            number
        )
    ){

        return Math.min(
            100,
            Math.max(
                0,
                Number(
                    fallback
                )
                ||
                0
            )
        );
    }


    return Math.min(
        100,
        Math.max(
            0,
            number
        )
    );
}


function volumeToAudioLevel(
    value,
    fallback = 100
){

    return (

        normalizeVolumePercent(
            value,
            fallback
        )

        /

        100
    );
}


/* =========================================================
   AUDIO CONTROL CENTER PRO MAX
========================================================= */

function effectiveVolumePercent(
    channelValue,
    muted = false,
    channelFallback = 100
){

    if(
        Boolean(
            muted
        )
    ){

        return 0;
    }


    const master =

        normalizeVolumePercent(

            alertSettings
                .masterVolume,

            100
        );


    const channel =

        normalizeVolumePercent(

            channelValue,

            channelFallback
        );


    return Math.round(

        (
            master
            *
            channel
        )

        /

        100
    );
}


function alertAudioVolumePercent(
    useCustomSound = false
){

    return effectiveVolumePercent(

        useCustomSound

            ?

            alertSettings
                .customSoundVolume

            :

            alertSettings
                .alertVolume,


        useCustomSound

            ?

            alertSettings
                .customSoundMuted

            :

            alertSettings
                .alertMuted,


        70
    );
}


function videoAudioVolumePercent(){

    return effectiveVolumePercent(

        alertSettings
            .videoVolume,

        alertSettings
            .videoMuted,

        80
    );
}


function ttsAudioVolumeLevel(){

    return (

        effectiveVolumePercent(

            alertSettings
                .ttsVolume,

            alertSettings
                .ttsMuted,

            100
        )

        /

        100
    );
}


function findPreferredSpeechVoice(){

    if(
        !window.speechSynthesis
    ){

        return null;
    }


    const voices =

        window
            .speechSynthesis
            .getVoices();


    if(
        !Array.isArray(
            voices
        )

        ||

        !voices.length
    ){

        return null;
    }


    const voiceURI =

        String(
            alertSettings
                .ttsVoiceURI
            ||
            ""
        )
        .trim();


    const voiceName =

        String(
            alertSettings
                .ttsVoiceName
            ||
            ""
        )
        .trim();


    const wantedLang =

        String(
            alertSettings
                .ttsLang
            ||
            "th-TH"
        )
        .trim()
        .toLowerCase();


    if(
        voiceURI

        &&

        voiceURI !==
        "auto"
    ){

        const exactURI =

            voices.find(
                voice =>
                    String(
                        voice.voiceURI
                        ||
                        ""
                    )
                    ===
                    voiceURI
            );


        if(
            exactURI
        ){

            return exactURI;
        }
    }


    if(
        voiceName
    ){

        const exactName =

            voices.find(
                voice =>
                    String(
                        voice.name
                        ||
                        ""
                    )
                    ===
                    voiceName
            );


        if(
            exactName
        ){

            return exactName;
        }
    }


    const exactLang =

        voices.find(
            voice =>
                String(
                    voice.lang
                    ||
                    ""
                )
                .toLowerCase()
                ===
                wantedLang
        );


    if(
        exactLang
    ){

        return exactLang;
    }


    const langPrefix =

        wantedLang
            .split(
                "-"
            )[0];


    const sameLanguage =

        voices.find(
            voice =>
                String(
                    voice.lang
                    ||
                    ""
                )
                .toLowerCase()
                .startsWith(
                    langPrefix
                )
        );


    if(
        sameLanguage
    ){

        return sameLanguage;
    }


    return (

        voices.find(
            voice =>
                Boolean(
                    voice.default
                )
        )

        ||

        voices[0]

        ||

        null
    );
}


/* =========================================================
   APPLY CURRENT VOLUME

   ใช้ตอน Dashboard เปลี่ยน Volume แบบ Realtime
========================================================= */

function applyCurrentVolumes(){

       AUDIO ELEMENT
    ====================================================== */

    try{

        const useCustomSound =

            Boolean(
                currentDonation
                &&
                currentDonation.customSound

        alertSound.volume =

            alertAudioVolumePercent(
                useCustomSound
            )

            /

    }catch(error){

        console.warn(
            "Apply Alert Volume:",
            error
        );
    }


    /* =====================================================
       CURRENT YOUTUBE PLAYER
    ====================================================== */

    try{

        if(
            youtubePlayer
            &&
            typeof youtubePlayer.setVolume
            ===
            "function"
        ){

            youtubePlayer.setVolume(

                videoAudioVolumePercent()
            );


            if(
                Boolean(
                    alertSettings
                        .videoMuted
                )

                ||

                videoAudioVolumePercent()
                <=
                0
            ){

                if(
                    typeof youtubePlayer.mute
                    ===
                    "function"
                ){

                    youtubePlayer.mute();
                }

            }else if(
                typeof youtubePlayer.unMute
                ===
                "function"
            ){

                youtubePlayer.unMute();
            }
        }

    }catch(error){

        console.warn(
            "Apply Video Volume:",
            error
        );
    }


    /*
    SpeechSynthesisUtterance ไม่รองรับปรับ volume/rate/pitch
    ระหว่างกำลังอ่านแบบ reliable

    ถ้า Mute TTS หรือ Master = 0 ระหว่างอ่าน
    ให้หยุดเสียงทันที
    */

    if(
        Boolean(
            alertSettings
                .ttsMuted
        )

        ||

        normalizeVolumePercent(
            alertSettings
                .masterVolume,
            100
        )
        <=
        0

        ||

        normalizeVolumePercent(
            alertSettings
                .ttsVolume,
            100
        )
        <=
        0
    ){

        cancelTTS();
    }
}

/* =========================================================
   QUEUE
========================================================= */

async function playNextDonation(){


    if(
        playing
        ||
        donationQueue.length ===
        0
    ){

        return;
    }


    playing =
        true;


    currentDonation =
        donationQueue.shift();


    try{


        /* =================================================
           VIDEO DONATION
        ================================================= */

        if(
            currentDonation.videoId
        ){

            const videoResult =
                await playVideoDonation(
                    currentDonation
                );


            /*
            ถ้า Video เล่นสำเร็จ
            จบ Donation นี้เลย
            */

            if(
                videoResult ===
                "complete"

                ||

                videoResult ===
                "ended"
            ){

                return;
            }


            /*
            ถ้า YouTube Error / Timeout
            fallback เป็น Alert ปกติ
            */

            console.warn(
                "Video failed -> fallback normal donation"
            );


            await showNormalDonation(
                currentDonation
            );


            return;
        }


        /* =================================================
           NORMAL
        ================================================= */

        await showNormalDonation(
            currentDonation
        );

    }
    catch(error){

        console.error(
            "Donation Overlay Error:",
            error
        );

    }
    finally{


        cleanupEverything();


        await delay(
            450
        );


        playing =
            false;


        currentDonation =
            null;


        playNextDonation();
    }
}

/* =========================================================
   WAIT YOUTUBE
========================================================= */

async function waitForYouTubeAPI(){


    if(
        youtubeApiReady

        &&

        window.YT

        &&

        window.YT.Player
    ){

        return;
    }


    await Promise.race([


        youtubeReadyPromise,


        delay(
            VIDEO_LOAD_TIMEOUT
        )
        .then(
            () => {

                throw new Error(
                    "YouTube IFrame API timeout"
                );
            }
        )
    ]);


    if(
        !window.YT

        ||

        !window.YT.Player
    ){

        throw new Error(
            "YouTube IFrame API unavailable"
        );
    }
}


/* =========================================================
   PLAY YOUTUBE CLIP
========================================================= */

async function playYouTubeClip(
    videoId,
    start,
    duration
){


    try{

        await waitForYouTubeAPI();

    }
    catch(error){

        console.error(
            "YouTube API:",
            error
        );


        return "error";
    }


    const safeStart =

        clamp(

            Math.floor(

                Number(
                    start
                )

                ||

                0
            ),

            0,

            VIDEO_MAX_START
        );


    const safeDuration =

        clamp(

            Math.floor(

                Number(
                    duration
                )

                ||

                VIDEO_MAX_DURATION
            ),

            1,

            VIDEO_MAX_DURATION
        );


    return new Promise(
        resolve => {


            let finished =
                false;


            let playbackStarted =
                false;


            let loadTimeout =
                null;


            let durationTimeout =
                null;


            let hardTimeout =
                null;


            const finish =
                async status => {


                    if(
                        finished
                    ){

                        return;
                    }


                    finished =
                        true;


                    clearTimeout(
                        loadTimeout
                    );


                    clearTimeout(
                        durationTimeout
                    );


                    clearTimeout(
                        hardTimeout
                    );


                    if(
                        videoProgressAnimation
                    ){

                        videoProgressAnimation
                            .cancel();


                        videoProgressAnimation =
                            null;
                    }


                    await destroyYouTubePlayer();


                    resolve(
                        status
                    );
                };


            /* =================================================
               START TIMER
            ================================================= */

            const startDurationTimer =
                () => {


                    if(
                        playbackStarted
                    ){

                        return;
                    }


                    playbackStarted =
                        true;


                    clearTimeout(
                        loadTimeout
                    );


                    videoProgressAnimation =

                        videoProgressFill
                            .animate(

                                [
                                    {
                                        transform:
                                            "scaleX(1)"
                                    },

                                    {
                                        transform:
                                            "scaleX(0)"
                                    }
                                ],

                                {

                                    duration:

                                        safeDuration

                                        *

                                        1000,


                                    easing:
                                        "linear",


                                    fill:
                                        "forwards"
                                }
                            );


                    durationTimeout =

                        setTimeout(

                            () => {

                                finish(
                                    "complete"
                                );
                            },

                            safeDuration

                            *

                            1000
                        );
                };


            /* =================================================
               STARTUP TIMEOUT
            ================================================= */

            loadTimeout =

                setTimeout(

                    () => {

                        finish(
                            "error"
                        );
                    },

                    VIDEO_LOAD_TIMEOUT
                );


            /* =================================================
               HARD TIMEOUT
            ================================================= */

            hardTimeout =

                setTimeout(

                    () => {

                        finish(
                            "error"
                        );
                    },

                    (
                        safeDuration
                        *
                        1000
                    )

                    +

                    VIDEO_HARD_GRACE
                );


            /* =================================================
               CREATE PLAYER
            ================================================= */

            try{


                ensureVideoPlayerHost();


                youtubePlayer =

                    new YT.Player(

                        "video-player",

                        {


                            width:
                                "100%",


                            height:
                                "100%",


                            videoId,


                            playerVars: {


                                autoplay:
                                    1,


                                controls:
                                    0,


                                disablekb:
                                    1,


                                fs:
                                    0,


                                iv_load_policy:
                                    3,


                                modestbranding:
                                    1,


                                playsinline:
                                    1,


                                rel:
                                    0,


                                start:
                                    safeStart
                            },


                            events: {


                                /* =============================
                                   READY
                                ============================= */

                                onReady:
                                    event => {


                                        try{


                                            event.target.seekTo(

                                                safeStart,

                                                true
                                            );


                                            /*
                                            Video Donation
                                            ต้องใช้เสียงคลิป
                                            */

                                            event.target.unMute();


                                            /*
                                            VOLUME MIXER
                                            */

                                            event.target.setVolume(

                                                videoAudioVolumePercent()
                                            );


                                            event.target.playVideo();

                                        }
                                        catch(error){

                                            console.warn(
                                                "YouTube onReady:",
                                                error
                                            );
                                        }
                                    },


                                /* =============================
                                   STATE
                                ============================= */

                                onStateChange:
                                    event => {


                                        if(
                                            event.data

                                            ===

                                            YT.PlayerState.PLAYING
                                        ){

                                            /*
                                            เผื่อ Volume
                                            ถูกเปลี่ยนระหว่างโหลด
                                            */

                                            try{

                                                event.target
                                                    .setVolume(

                                                        videoAudioVolumePercent()
                                                    );

                                            }catch{}


                                            startDurationTimer();
                                        }


                                        if(
                                            event.data

                                            ===

                                            YT.PlayerState.ENDED
                                        ){

                                            finish(
                                                "ended"
                                            );
                                        }
                                    },


                                /* =============================
                                   ERROR
                                ============================= */

                                onError:
                                    event => {


                                        console.warn(
                                            "YouTube Player Error:",
                                            event.data
                                        );


                                        finish(
                                            "error"
                                        );
                                    }
                            }
                        }
                    );

            }
            catch(error){

                console.error(
                    "Create YouTube Player:",
                    error
                );


                finish(
                    "error"
                );
            }
        }
    );
}


/* =========================================================
   PLAYER HOST
========================================================= */

function ensureVideoPlayerHost(){


    let host =
        document.getElementById(
            "video-player"
        );


    if(
        host

        &&

        host.tagName
            .toLowerCase()

        ===

        "div"
    ){

        return host;
    }


    if(
        host
    ){

        host.remove();
    }


    host =
        document.createElement(
            "div"
        );


    host.id =
        "video-player";


    const shell =

        videoWrap.querySelector(
            ".video-shell"
        );


    const progress =

        shell.querySelector(
            ".video-progress"
        );


    shell.insertBefore(

        host,

        progress
    );


    return host;
}


/* =========================================================
   DESTROY YOUTUBE
========================================================= */

async function destroyYouTubePlayer(){


    if(
        youtubePlayer
    ){


        try{

            youtubePlayer.stopVideo();

        }catch{}


        try{

            youtubePlayer.destroy();

        }catch{}


        youtubePlayer =
            null;
    }


    ensureVideoPlayerHost();
}

/* =========================================================
   NORMALIZE VIDEO
========================================================= */

function normalizeVideoDonation(
    donation
){


    const rawVideoId =

        String(

            donation.videoId

            ||

            donation.video_id

            ||

            ""
        )
        .trim();


    let videoId =

        /^[A-Za-z0-9_-]{11}$/
            .test(
                rawVideoId
            )

            ?

            rawVideoId

            :

            null;


    if(
        !videoId

        &&

        (
            donation.videoUrl

            ||

            donation.video_url
        )
    ){

        videoId =

            extractYouTubeId(

                donation.videoUrl

                ||

                donation.video_url
            );
    }


    if(
        !videoId
    ){

        return {

            videoUrl:
                null,

            videoId:
                null,

            videoStart:
                null,

            videoDuration:
                null
        };
    }


    const videoStart =

        clamp(

            Math.floor(

                Number(

                    donation.videoStart

                    ??

                    donation.video_start

                    ??

                    0
                )

                ||

                0
            ),

            0,

            VIDEO_MAX_START
        );


    const videoDuration =

        clamp(

            Math.floor(

                Number(

                    donation.videoDuration

                    ??

                    donation.video_duration

                    ??

                    VIDEO_MAX_DURATION
                )

                ||

                VIDEO_MAX_DURATION
            ),

            1,

            VIDEO_MAX_DURATION
        );


    return {


        videoUrl:

            `https://www.youtube.com/watch?v=${videoId}`,


        videoId,


        videoStart,


        videoDuration
    };
}


/* =========================================================
   EXTRACT YOUTUBE ID
========================================================= */

function extractYouTubeId(
    value
){


    let raw =

        String(
            value
            ||
            ""
        )
        .trim();


    if(
        !raw
    ){

        return null;
    }


    if(
        !/^https?:\/\//i
            .test(
                raw
            )
    ){

        raw =

            "https://"

            +

            raw;
    }


    let url;


    try{

        url =
            new URL(
                raw
            );

    }
    catch{

        return null;
    }


    const host =

        url.hostname
            .toLowerCase()
            .replace(
                /^www\./,
                ""
            );


    let id =
        null;


    if(
        host ===
        "youtu.be"
    ){

        id =

            url.pathname
                .split("/")
                .filter(
                    Boolean
                )[0]

            ||

            null;
    }


    if(
        host ===
            "youtube.com"

        ||

        host ===
            "m.youtube.com"

        ||

        host ===
            "music.youtube.com"
    ){


        if(
            url.pathname ===
            "/watch"
        ){

            id =

                url.searchParams
                    .get(
                        "v"
                    );
        }


        else if(

            /^\/(shorts|live|embed)\//
                .test(
                    url.pathname
                )
        ){

            id =

                url.pathname
                    .split("/")
                    .filter(
                        Boolean
                    )[1]

                ||

                null;
        }
    }


    if(
        id

        &&

        /^[A-Za-z0-9_-]{11}$/
            .test(
                id
            )
    ){

        return id;
    }


    return null;
}


/* =========================================================
   ALERT SOUND

   Tier:
   alertVolume

   Custom:
   customSoundVolume
========================================================= */

async function playAlertSound(
    donation
){


    try{


        stopAlertAudio();


        const nextSource =

            donation.soundUrl

            ||

            "/sounds/alert.mp3";


        /*
        =====================================================
        VOLUME
        =====================================================
        */

        const selectedVolume =

            alertAudioVolumePercent(

                Boolean(
                    donation.customSound
                )
            );


        const fallbackVolume =
            selectedVolume;


        alertSound.volume =

            (
                normalizeVolumePercent(
                    selectedVolume,
                    fallbackVolume
                )
                /
                100
            );


        if(
            alertSound
                .getAttribute(
                    "src"
                )

            !==

            nextSource
        ){

            alertSound.src =
                nextSource;


            alertSound.load();
        }


        /*
        เผื่อ load()
        */

        alertSound.volume =

            (
                normalizeVolumePercent(
                    selectedVolume,
                    fallbackVolume
                )
                /
                100
            );


        if(
            selectedVolume
            <=
            0
        ){

            return;
        }


        const playPromise =
            alertSound.play();


        if(
            playPromise

            &&

            typeof playPromise.then

            ===

            "function"
        ){

            await playPromise;
        }


        await waitForAudioEnd(
            alertSound
        );

    }
    catch(error){

        console.warn(
            "Alert Audio:",
            error
        );
    }
}

/* =========================================================
   SAFE SOUND URL
========================================================= */

function sanitizeSoundUrl(
    value
){


    const raw =

        String(
            value
            ||
            ""
        )
        .trim();


    if(
        !raw
    ){

        return "/sounds/alert.mp3";
    }


    if(
        raw.startsWith(

        )
    ){

        return raw;

        )

    }


    return "/sounds/alert.mp3";
}


/* =========================================================
   WAIT AUDIO
========================================================= */

function waitForAudioEnd(
    audio
){


    return new Promise(
        resolve => {


            if(
                audio.paused

                ||

                audio.ended
            ){

                resolve();

                return;
            }


            let done =
                false;


            let timeoutId =
                null;


            const finish =
                () => {


                    if(
                        done
                    ){

                        return;
                    }


                    done =
                        true;


                    audio.removeEventListener(

                        "ended",

                        finish
                    );


                    audio.removeEventListener(

                        "error",

                        finish
                    );


                    clearTimeout(
                        timeoutId
                    );


                    resolve();
                };


            audio.addEventListener(

                "ended",

                finish,

                {
                    once:
                        true
                }
            );


            audio.addEventListener(

                "error",

                finish,

                {
                    once:
                        true
                }
            );


            timeoutId =

                setTimeout(

                    finish,

                    12000
                );
        }
    );
}


/* =========================================================
   CREATE TTS
========================================================= */

function createSpeechText(
    donation
){


    const name =

        donation.name

        ||

        "Anonymous";


    let text =

        `${name} สนับสนุน ${formatAmountForSpeech(
            donation.amount
        )} บาท`;


    if(
        Boolean(
            alertSettings.readMessage
        )

        &&

        donation.message
    ){

        text +=

            ` ข้อความว่า ${donation.message}`;
    }


    return text;
}


/* =========================================================
   SPEAK
========================================================= */

function speak(
    text
){


    return new Promise(
        resolve => {


            if(
                !window.speechSynthesis

                ||

                !text
            ){

                resolve();

                return;
            }


            cancelTTS();


            const utterance =

                new SpeechSynthesisUtterance(
                    text
                );


            const preferredVoice =
                findPreferredSpeechVoice();


            if(
                preferredVoice
            ){

                utterance.voice =
                    preferredVoice;
            }


            utterance.lang =

                preferredVoice
                    ?.lang

                ||

                String(
                    alertSettings
                        .ttsLang
                    ||
                    "th-TH"
                );


            utterance.rate =

                clamp(

                    Number(
                        alertSettings.ttsRate
                    )

                    ||

                    1,

                    .5,

                    2
                );


            utterance.pitch =

                clamp(

                    Number(
                        alertSettings
                            .ttsPitch
                    )

                    ||

                    1,

                    .5,

                    2
                );


            /*
            =====================================================
            TTS VOLUME
            SpeechSynthesis ใช้ 0 - 1
            =====================================================
            */

            utterance.volume =
                ttsAudioVolumeLevel();


            if(
                utterance.volume
                <=
                0

                ||

                Boolean(
                    alertSettings
                        .ttsMuted
                )
            ){

                resolve();

                return;
            }


            let finished =
                false;


            let timeoutId =
                null;


            const finish =
                () => {


                    if(
                        finished
                    ){

                        return;
                    }


                    finished =
                        true;


                    clearTimeout(
                        timeoutId
                    );


                    resolve();
                };


            utterance.onend =
                finish;


            utterance.onerror =
                finish;


            window
                .speechSynthesis
                .speak(
                    utterance
                );


            timeoutId =

                setTimeout(

                    finish,

                    Math.max(

                        5000,

                        estimateSpeechDuration(
                            text
                        )

                        +

                        4000
                    )
                );
        }
    );
}


/* =========================================================
   CANCEL TTS
========================================================= */

function cancelTTS(){


    if(
        window.speechSynthesis
    ){

        try{

            window
                .speechSynthesis
                .cancel();

        }catch{}
    }
}


/* =========================================================
   ESTIMATE TTS
========================================================= */

function estimateSpeechDuration(
    text
){


    const characters =

        String(
            text
            ||
            ""
        )
        .length;


    const rate =

        clamp(

            Number(
                alertSettings.ttsRate
            )

            ||

            1,

            .5,

            2
        );


    return Math.max(

        2800,

        Math.min(

            20000,

            (
                characters

                /

                11

                *

                1000
            )

            /

            rate
        )
    );
}

                        ),


                    easing:
                        "linear",


                    fill:
                        "forwards"
                }
            );
}

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    amount
){


    particles.innerHTML =
        "";


    for(
        let index =
            0;

        index <
        amount;

        index++
    ){


        const particle =

            document
                .createElement(
                    "div"
                );


        particle.className =
            "particle";


        particle.style.left =

            (
                22

                +

                Math.random()

                *

                56
            )

            +

            "%";


        particle.style.bottom =

            (
                80

                +

                Math.random()

                *

                95
            )

            +

            "px";


        particle.style.animationDelay =

            (
                Math.random()

                *

                .7
            )

            +

            "s";


        particle.style.animationDuration =

            (
                1.3

                +

                Math.random()

                *

                1.2
            )

            +

            "s";


        const size =

            4

            +

            Math.random()

            *

            7;


        particle.style.width =

            size

            +

            "px";


        particle.style.height =

            size

            +

            "px";


        particles
            .appendChild(
                particle
            );
    }
}


/* =========================================================
   FIRST CHARACTER
========================================================= */

function getFirstCharacter(
    value
){


    const text =

        String(
            value
            ||
            "A"
        )
        .trim();


    if(
        !text
    ){

        return "A";
    }


    return Array
        .from(
            text
        )[0]
        .toUpperCase();
}


/* =========================================================
   AMOUNT SPEECH
========================================================= */

function formatAmountForSpeech(
    amount
){


    return Number(
        amount
        ||
        0
    )
    .toLocaleString(
        "th-TH"
    );
}


/* =========================================================
   CLAMP
========================================================= */

function clamp(
    value,
    min,
    max
){


    return Math.min(

        max,

        Math.max(
            min,
            value
        )
    );
}


/* =========================================================
   DELAY
========================================================= */

function delay(
    milliseconds
){


    return new Promise(

        resolve =>

            setTimeout(
                resolve,
                milliseconds
            )
    );
}
