<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMR29 Goal Control</title>

<style>
* { box-sizing: border-box; }

:root {
    --bg: #0b0b10;
    --card: #17171f;
    --input: #24242e;
    --text: #fff;
    --sub: #9595a3;
    --accent: #ff5b7f;
    --accent2: #ff8ca7;
    --green: #66dfa0;
    --red: #ff6b77;
    --border: rgba(255,255,255,.08);
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 45px 18px;
    background:
        radial-gradient(circle at 50% -10%, rgba(255,91,127,.16), transparent 32%),
        var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Noto Sans Thai", Arial, sans-serif;
}

.wrap {
    width: 100%;
    max-width: 720px;
    margin: auto;
}

.header {
    margin-bottom: 24px;
}

.eyebrow {
    color: var(--accent2);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.8px;
}

h1 {
    margin: 6px 0 6px;
    font-size: 30px;
}

.sub {
    color: var(--sub);
    font-size: 14px;
}

.card {
    padding: 24px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: rgba(23,23,31,.95);
    box-shadow: 0 25px 80px rgba(0,0,0,.30);
}

label {
    display: block;
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 700;
}

.field {
    margin-bottom: 18px;
}

input[type="text"],
input[type="number"],
input[type="password"] {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid transparent;
    border-radius: 12px;
    outline: none;
    background: var(--input);
    color: white;
    font: inherit;
}

input:focus {
    border-color: rgba(255,91,127,.7);
    box-shadow: 0 0 0 3px rgba(255,91,127,.10);
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 13px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,.035);
}

.switch-row label {
    margin: 0;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 12px 17px;
    cursor: pointer;
    color: white;
    font: inherit;
    font-weight: 800;
    transition: .2s ease;
}

button:hover {
    transform: translateY(-2px);
}

.primary {
    background: linear-gradient(135deg, var(--accent), #ff3e69);
    box-shadow: 0 9px 28px rgba(255,91,127,.22);
}

.secondary {
    background: #2b2b35;
}

.danger {
    background: rgba(255,107,119,.11);
    color: #ff8791;
    border: 1px solid rgba(255,107,119,.20);
}

.preview-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

#previewTitle {
    margin: 0;
    font-size: 19px;
}

.percent {
    color: var(--accent2);
    font-weight: 900;
}

.money {
    margin: 18px 0 12px;
    font-size: 31px;
    font-weight: 900;
}

.money span {
    color: var(--sub);
    font-size: 15px;
    font-weight: 600;
}

.progress {
    height: 11px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255,255,255,.06);
}

.progress > div {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #ff5179, #ff9ab5);
    box-shadow: 0 0 16px rgba(255,91,127,.28);
    transition: width .7s cubic-bezier(.16,1,.3,1);
}

.status {
    min-height: 22px;
    margin-top: 12px;
    color: var(--sub);
    font-size: 13px;
}

.status.ok { color: var(--green); }
.status.error { color: var(--red); }

.key-box {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
}

@media (max-width: 600px) {
    .row {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="wrap">

    <div class="header">
        <div class="eyebrow">AMR29 CONTROL PANEL</div>
        <h1>Donation Goal</h1>
        <div class="sub">
            ปรับ Goal จากหน้านี้ แล้วหน้า Donate จะเปลี่ยนแบบ Real-time
        </div>
    </div>

    <div class="card">
        <div class="field">
            <label>Admin Key</label>

            <div class="key-box">
                <input
                    id="adminKey"
                    type="password"
                    placeholder="ใส่ ADMIN_KEY จาก .env"
                >

                <button
                    class="secondary"
                    onclick="connectAdmin()"
                >
                    เชื่อมต่อ
                </button>
            </div>
        </div>

        <div id="connectionStatus" class="status">
            ยังไม่ได้เชื่อมต่อ
        </div>
    </div>

    <div class="card">
        <div class="field">
            <label>ชื่อ Goal</label>

            <input
                id="goalTitle"
                type="text"
                maxlength="60"
                placeholder="เช่น เป้าหมายอัปเกรดคอม"
            >
        </div>

        <div class="row">
            <div class="field">
                <label>เป้าหมาย (บาท)</label>

                <input
                    id="goalTarget"
                    type="number"
                    min="1"
                    step="1"
                    placeholder="5000"
                >
            </div>

            <div class="field">
                <label>สถานะ</label>

                <div class="switch-row">
                    <span>แสดง Donation Goal</span>

                    <input
                        id="goalEnabled"
                        type="checkbox"
                        checked
                    >
                </div>
            </div>
        </div>

        <div class="actions">
            <button
                class="primary"
                onclick="saveGoal()"
            >
                บันทึกและอัปเดตเว็บ
            </button>

            <button
                class="danger"
                onclick="resetGoal()"
            >
                เริ่ม Goal ใหม่จาก 0
            </button>
        </div>

        <div id="saveStatus" class="status"></div>
    </div>

    <div class="card">
        <div class="preview-title">
            <h2 id="previewTitle">
                เป้าหมายสนับสนุน
            </h2>

            <div
                id="previewPercent"
                class="percent"
            >
                0%
            </div>
        </div>

        <div class="money">
            <b id="previewCurrent">0</b>
            <span>
                / <b id="previewTarget">5,000</b> บาท
            </span>
        </div>

        <div class="progress">
            <div id="previewBar"></div>
        </div>
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const adminKey =
    document.getElementById("adminKey");

const goalTitle =
    document.getElementById("goalTitle");

const goalTarget =
    document.getElementById("goalTarget");

const goalEnabled =
    document.getElementById("goalEnabled");

const connectionStatus =
    document.getElementById("connectionStatus");

const saveStatus =
    document.getElementById("saveStatus");


adminKey.value =
    sessionStorage.getItem(
        "amr29AdminKey"
    ) || "";


function headers() {
    return {
        "Content-Type":
            "application/json",

        "x-admin-key":
            adminKey.value
    };
}


async function connectAdmin() {

    const key =
        adminKey.value.trim();

    if (!key) {
        setConnection(
            "1915",
            false
        );

        return;
    }

    try {
        const response =
            await fetch(
                "/api/admin/goal",
                {
                    headers: {
                        "x-admin-key":
                            key
                    }
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.message ||
                "เชื่อมต่อไม่สำเร็จ"
            );
        }

        sessionStorage.setItem(
            "amr29AdminKey",
            key
        );

        goalTitle.value =
            data.goal.title;

        goalTarget.value =
            data.goal.target;

        goalEnabled.checked =
            data.goal.enabled;

        renderPreview(
            data.goal
        );

        setConnection(
            "เชื่อมต่อสำเร็จ",
            true
        );

    } catch (error) {

        setConnection(
            error.message,
            false
        );
    }
}


async function saveGoal() {

    saveStatus.className =
        "status";

    saveStatus.textContent =
        "กำลังบันทึก...";

    try {
        const response =
            await fetch(
                "/api/admin/goal",
                {
                    method: "POST",
                    headers: headers(),

                    body:
                        JSON.stringify({
                            title:
                                goalTitle.value,

                            target:
                                Number(
                                    goalTarget.value
                                ),

                            enabled:
                                goalEnabled.checked
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.message ||
                "บันทึกไม่สำเร็จ"
            );
        }

        renderPreview(
            data.goal
        );

        saveStatus.className =
            "status ok";

        saveStatus.textContent =
            "✓ บันทึกแล้ว หน้า Donate อัปเดตเรียบร้อย";

    } catch (error) {

        saveStatus.className =
            "status error";

        saveStatus.textContent =
            "✕ " + error.message;
    }
}


async function resetGoal() {

    const okay =
        confirm(
            "เริ่ม Goal ใหม่จาก 0 ใช่ไหม?\n\nประวัติโดเนทเดิมจะไม่ถูกลบ"
        );

    if (!okay) {
        return;
    }

    try {
        const response =
            await fetch(
                "/api/admin/goal/reset",
                {
                    method: "POST",
                    headers: headers()
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.message ||
                "รีเซ็ตไม่สำเร็จ"
            );
        }

        renderPreview(
            data.goal
        );

        saveStatus.className =
            "status ok";

        saveStatus.textContent =
            "✓ เริ่ม Goal ใหม่จาก 0 แล้ว";

    } catch (error) {

        saveStatus.className =
            "status error";

        saveStatus.textContent =
            "✕ " + error.message;
    }
}


function renderPreview(goal) {

    document
        .getElementById(
            "previewTitle"
        )
        .textContent =
            goal.title;

    document
        .getElementById(
            "previewCurrent"
        )
        .textContent =
            Number(
                goal.total
            ).toLocaleString();

    document
        .getElementById(
            "previewTarget"
        )
        .textContent =
            Number(
                goal.target
            ).toLocaleString();

    document
        .getElementById(
            "previewPercent"
        )
        .textContent =
            goal.percent + "%";

    document
        .getElementById(
            "previewBar"
        )
        .style.width =
            goal.percent + "%";
}


function setConnection(
    text,
    success
) {

    connectionStatus.className =
        success
            ? "status ok"
            : "status error";

    connectionStatus.textContent =
        success
            ? "✓ " + text
            : "✕ " + text;
}


socket.on(
    "goal-update",
    goal => {

        renderPreview(
            goal
        );

    }
);


if (adminKey.value) {
    connectAdmin();
}
</script>

</body>
</html>
